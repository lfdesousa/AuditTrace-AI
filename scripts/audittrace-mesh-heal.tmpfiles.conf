# audittrace-mesh-heal.tmpfiles.conf — #411 v2: durable watched-dir ownership
# + MESH-HEAL-DIR (2026-08-22): durable TOP-LEVEL ownership too.
#
# systemd-tmpfiles(5) rule that recreates the WS5 Option-B heal-state dirs,
# runner-owned + mode 0775, on EVERY BOOT (systemd-tmpfiles-setup.service runs
# before audittrace-mesh-healer.path is armed). This is the DURABLE fix for
# #411: a root-recreated dir (reboot / manual `mkdir` / a drifted install)
# used to leave the runner unable to write a heal request into the exact dir
# `audittrace-mesh-healer.path`'s `DirectoryNotEmpty=` watches — which is what
# made the rejected v1 "write to an unwatched fallback dir" fix vacuous
# (nothing was ever watching the fallback, so the root `.path` unit never
# fired). Recreating THIS dir, THIS way, on every boot means the runner is
# ALWAYS able to write into the SAME dir the `.path` unit watches — no
# unwatched location is ever needed.
#
# MESH-HEAL-DIR (2026-08-22): the top-level `d` line below (the PARENT of
# requests/ and results/) closes a second gap the v2 fix above didn't cover.
# `PrivilegedHealer._publish_request` writes its atomic-rename tmp file to
# the TOP-LEVEL heal_dir — `self._heal_dir / f".{request_id}.json.tmp"` —
# deliberately OUTSIDE `requests/` so the `.path` unit's `DirectoryNotEmpty=`
# watcher never fires on a half-written request, then `os.replace`s it into
# `requests/`. Without a `d` line for the top-level dir, systemd-tmpfiles
# only ever created `requests/` and `results/`, leaving the top-level parent
# a root-owned default (0755 root:root) whenever it didn't already exist —
# so the non-root runner's `.tmp` write PermissionError'd before it ever got
# to `os.replace`. This line must come FIRST (systemd-tmpfiles applies `d`
# lines in file order and a child's `d` line implicitly creates missing
# parents anyway, but listing the parent explicitly, first, keeps the rule
# self-documenting and its ownership independently durable across reboots).
# The tmp-write location itself is UNCHANGED by this fix — see
# `scripts/deploy/mesh.py::PrivilegedHealer._publish_request`.
#
# The three paths below MUST stay byte-identical to:
#   * `DirectoryNotEmpty=` in scripts/audittrace-mesh-healer.path (requests/)
#   * `Environment=MESH_HEAL_DIR=` in scripts/audittrace-mesh-healer.service,
#     joined with `requests/` and `results/` (and bare, for the top-level)
#   * `mesh_heal_dir()` in scripts/deploy/mesh.py (env `MESH_HEAL_DIR`,
#     default `/var/lib/audittrace/mesh-heal`)
# tests/test_deploy_mesh.py asserts this at the source-of-truth level (parses
# all three + this file and compares) so the four CANNOT silently drift apart.
#
# Portability invariant: the OWNER/GROUP columns below are PLACEHOLDERS —
# @RUNNER_USER@ / @RUNNER_GROUP@ — substituted at install time with the
# INVOKING runner's own user/group (never a hardcoded username). See the
# render-and-install block in scripts/audittrace-mesh-resettle.sh's header
# comment (the same out-of-band, non-Helm install path as the two units).
#
# Type Path                                 Mode UID            GID            Age Argument
d     /var/lib/audittrace/mesh-heal          0775 @RUNNER_USER@  @RUNNER_GROUP@ -   -
d     /var/lib/audittrace/mesh-heal/requests 0775 @RUNNER_USER@  @RUNNER_GROUP@ -   -
d     /var/lib/audittrace/mesh-heal/results  0775 @RUNNER_USER@  @RUNNER_GROUP@ -   -
