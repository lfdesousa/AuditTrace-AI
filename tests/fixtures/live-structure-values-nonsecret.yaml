# NON-SECRET structural subset of the live release values (image/repository/flag
# structure only; no credentials). Source: reviewer extraction 2026-10-04 of
# `helm get values audittrace`. Used by tests/test_chart_private_image_pull_secrets.py.
console:
  enabled: true
global:
  imagePullSecrets:
  - name: ghcr-pull-secret
  security:
    allowInsecureImages: true
llmStub:
  enabled: false
postgresql:
  image:
    registry: ghcr.io
    repository: lfdesousa/audittrace-postgresql
redis:
  image:
    registry: ghcr.io
    repository: lfdesousa/audittrace-redis
