[build-system]
# Exact pins (DEP-LOCK-AT C1): installs run --no-build-isolation against the
# hashed copies in the locks, so these are documentation + the isolated-build
# fallback; tests/test_dep_lock_sync.py asserts they equal requirements-build.in.
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audittrace-ai"
version = "1.29.5"
description = "AuditTrace-AI: sovereign AI memory server with 4-tier memory architecture and OAuth2 authentication"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "AGPL-3.0"}
authors = [
    {name = "Luis Filipe de Sousa", email = "ldesousapro@allaboutdata.eu"},
]
maintainers = [
    {name = "Luis Filipe de Sousa", email = "ldesousapro@allaboutdata.eu"},
]
keywords = ["ai", "memory", "oauth2", "sovereign", "llama", "chromadb", "audittrace"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi==0.146.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    # langchain and langchain-community dropped in ADR-025 — the repo only
    # used them passively via `from langchain_core.documents import Document`.
    # langchain-core is retained explicitly so the dataclass import keeps
    # working without pulling the full Langchain + langchain-community tree.
    "langchain-core==1.6.12",
    # chromadb 1.x — provides AsyncHttpClient (memory-server uses the async
    # Chroma client so vector I/O never blocks the event loop). The .venv is
    # already on 1.5.7 and the suite is green on it.
    "chromadb==1.5.9",
    "python-jose[cryptography]==3.5.0",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
    "langfuse==4.18.0",
    "openai==3.35.1",
    "alembic==1.20.0",
    "sqlalchemy[asyncio]==2.0.55",
    # asyncpg = production async Postgres driver. psycopg2-binary kept for
    # Alembic + the sync RLS oracle test (out-of-band of the request loop).
    # aiosqlite = async SQLite for the in-memory test engine.
    "asyncpg==0.32.0",
    "psycopg2-binary==2.9.13",
    "aiosqlite==0.22.1",
    "redis==8.1.0",
    # ADR-057 — RabbitMQ AMQP client for the scan-control broker
    # (PR-B3 ScanRequestPublisher + PR-B4 verdict/audit consumers).
    # ADR-046 chat persistence stays on redis-py via Redis Streams.
    "aio-pika==10.1.1",
    # ADR-006 — shared object-storage abstraction. v0.1.0 ships
    # S3ObjectStorageProvider ABC + MinIO + AWS S3 backends (IRSA-native
    # via botocore's default credential chain). `minio` stays as a direct
    # dep because the shared package re-uses it for the MinIO backend AND
    # for graceful migration of the existing call sites — drop it in a
    # follow-up once the grep audit confirms zero direct references.
    # DEP-LOCK-AT §4.4: pinned to the full commit SHA of tag v0.1.1 (pip cannot
    # hash VCS requirements; a SHA is content-addressed). It is the ONLY copy of
    # this SHA: install-locked.sh and the Dockerfile READ it from this line, and
    # tests/test_dep_lock_install_paths.py forbids a second one. Omitted from the
    # locks (--no-emit-package) and installed --no-deps --no-build-isolation.
    "audittrace-object-storage @ git+https://github.com/lfdesousa/audittrace-object-storage.git@cc21c5530e1a471d48b697f3ff8f3df1cd5c0185",
    "minio==7.2.20",
    "pymupdf==1.28.2",
    # pyhanko: PAdES / PDF signature validation (gap-inventory item #12).
    # Detect-and-record only in v1 — never reject. Adds ~10 MB
    # to image size (cryptography, asn1crypto, pyhanko-certvalidator
    # transitively). pyhanko-certvalidator declares the trust-context
    # for OCSP/CRL chains. The [etsi] extra adds the EU LOTL walker
    # used by EuLotlTrustStoreBuilder (ADR-052 §3 / §6); pyhanko
    # ships the LOTL bootstrap signing keys so no out-of-band cert
    # vendoring is required. ImportError-guarded at the call site
    # so an air-gapped customer using StaticTrustStoreBuilder can
    # omit the extra and still get a working memory-server. See
    # docs/architecture/pdf-ingestion-gaps.md §2.3.
    # The [async-http] extra brings aiohttp (transitive dep of the
    # etsi LOTL walker — pyhanko's [etsi] extra does NOT pull aiohttp
    # on its own, verified 2026-05-09 against pyhanko 0.35.1). Both
    # extras must be co-installed for EuLotlTrustStoreBuilder.
    # Bounded to the tested minor (#366): pyhanko's private ETSI helpers and
    # its sync/async wrapper surface change between minors (0.36 added the
    # `validation_time` argument that silently broke the Swiss TSL builder).
    # Bump deliberately, with the AC6/AC9 guard tests, never by drift.
    "pyhanko[etsi,async-http]==0.37.0",
    "pyhanko-certvalidator==0.32.1",
    # pytesseract: tier-B item #1 — OCR for scanned pages. Python
    # binding only; the actual `tesseract` binary + language packs
    # (eng+deu+fra+ita) are installed via apt in the Dockerfile.
    # Graceful degradation: if the binary is missing at runtime,
    # `_ocr_render_page` emits a `no_text_layer` warning rather than
    # crashing — keeps unit tests green on hosts that don't have
    # tesseract installed locally.
    "pytesseract==0.3.13",
    # ADR-063 Phase 1 — official MCP Python SDK. Only ``mcp.types`` is
    # used (the Pydantic message shapes for the JSON-RPC 2.0 envelope);
    # the SDK's own server/session-management transport is intentionally
    # NOT used so the MCP endpoint can be a plain FastAPI route wired
    # through the existing ``require_user`` auth dependency + RLS
    # ContextVar binding (routes/mcp.py). Upper-bounded to the current
    # major so a future SDK 2.x doesn't silently change message shapes
    # under us.
    "mcp==1.30.0",
    # SEC-JWT-IN-LANGFUSE-SPAN S-C1 — bounded to the tested minor (not
    # just a floor). ``ScrubbingSpanProcessor`` (telemetry.py) rewrites
    # PRIVATE ReadableSpan/BoundedAttributes fields; a later SDK minor
    # could rename them and the mechanism would fail OPEN, SILENTLY (no
    # ``__slots__`` means a stale attribute name just creates a new,
    # never-read one — nothing raises). An unbounded floor let the
    # deployed image resolve a newer, untested minor than CI ever ran
    # (the FINDING this spec traces to: langfuse 4.17 one day after
    # release). Bump deliberately, together with requirements.txt, after
    # re-running the startup self-test (telemetry._run_startup_scrub_self_test)
    # against the new minor.
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp==1.45.1",
    "opentelemetry-instrumentation-fastapi==0.66b1",
    "opentelemetry-instrumentation-logging==0.66b1",
    "opentelemetry-instrumentation-httpx==0.66b1",
    "opentelemetry-instrumentation-urllib3==0.66b1",
    "opentelemetry-instrumentation-sqlalchemy==0.66b1",
    "opentelemetry-instrumentation-redis==0.66b1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-mock==3.17.0",
    "fakeredis==2.40.0",
    "httpx==0.28.1",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "black==26.10.1",
    "pre-commit==4.7.0",
    "types-redis==4.6.0.20241004",
    # PyYAML — used by tests/test_version_drift.py to parse
    # charts/audittrace/Chart.yaml. Already a transitive dep via
    # pyhanko/etsi but declared explicitly so the dev environment
    # is self-contained (locked by `make lock`).
    "pyyaml==6.0.3",
    # DEP-LOCK-AT Q1/Q5 + C1: the lock compiler and the installer are pinned
    # IN the dev lock (hashed) so every checkout and CI job compiles and
    # installs with the same uv/pip. Never `pip install --upgrade pip`.
    "uv==0.13.1",
    "pip==26.2.1",
]

# CI-Agent gate tooling — GATEKEEPER, NOT a runtime/test dependency; NEVER
# installed into the image AND NEVER into the app/test venv. This group holds
# the offline semgrep security-lint gate (#382, ADR-059 WS1 — the first
# component of the local deterministic CI-Agent). It is DELIBERATELY kept out
# of both `dependencies` and the `dev` extra so that:
#   * the runtime/dev locks (requirements.txt, requirements-dev.txt) never
#     contain semgrep, and
#   * the Docker image build (`pip install --require-hashes -r
#     requirements.txt`) never pulls semgrep.
# CRITICAL — install semgrep ISOLATED, via pipx, never `pip install -e .[gate]`
# into the app/.venv:  semgrep hard-pins
# `opentelemetry-instrumentation-requests~=0.58b0`, which DOWNGRADES the whole
# `opentelemetry-instrumentation-*` line from the app's 0.65b0 to 0.58b0.
# Against fastapi 0.140.x (which now puts `_IncludedRouter` objects in
# `app.routes`), otel-instrumentation-fastapi 0.58b0's route detection raises
# AttributeError on a CORS/OPTIONS preflight (proven 2026-07-28 via
# tests/test_server.py::TestCorsOriginsToggle in CI). `pip check` calls the
# downgrade "consistent" because the pin IS satisfied — the break is runtime,
# not metadata. The shipped image never sees it (installs from
# requirements.txt, no semgrep, keeps 0.65b0). So this group exists only as
# the PINNED SOURCE OF TRUTH for the version; the actual install is the
# HASHED gate lock (DEP-LOCK-AT C7) into an ISOLATED venv:
#     make gate-venv    # requirements-gate.txt, --require-hashes, own venv
# Keep the CI (`.github/workflows/ci.yml`) + Makefile pins in lockstep with
# the version here. semgrep is PINNED for determinism: same code + same rules
# + same engine → same findings, no wall-clock, no network. See
# ci/semgrep/rules.yml and the `security-lint` Makefile target.
gate = [
    "semgrep==1.171.0",
]

[project.urls]
Homepage = "https://github.com/lfdesousa/AuditTrace-AI"
Documentation = "https://github.com/lfdesousa/AuditTrace-AI#readme"
Repository = "https://github.com/lfdesousa/AuditTrace-AI"
Issues = "https://github.com/lfdesousa/AuditTrace-AI/issues"

[project.scripts]
audittrace = "audittrace.server:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --cov=src --cov-report=term --cov-report=xml --cov-fail-under=90"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "allow_cluster_tool(tool, reason): opt-in half of the hermetic cluster-tool guard (tests/conftest.py, SPEC 2026-10-11-SPEC-test-parity-scripted-enforcement.md R3) — must be paired with a matching entry in tests/hermetic_allowlist.py or the guard still fails the test.",
]

[tool.coverage.run]
# `scripts/deploy` (the WS2 deterministic deploy runner) is measured alongside
# the app package so the per-file ≥90% gate applies to it too. It is added to
# `source` AND to the `--cov=scripts/deploy` flag in `make test` / CI: config
# `source` alone is filtered out by the CLI `--cov=src`, and `--cov` alone is
# filtered out by config `source` — coverage.py measures a file only when it is
# reachable via BOTH. `scripts/hooks` (#397, the pre-push hook's decision
# logic package — `scripts/hooks/prepush_pr_body_gate.py`) joins it the same
# way, so the new Python helper is subject to the same per-file gate as
# everything else. `scripts/release` (#398, the deterministic release-cut
# runner) joins the same way for the same reason. `scripts/curator`
# (SDLC-ADR-002, the tier-aware Memory Curator runner) joins the same way too.
# `scripts/network` (#443, the mesh network-switch resilience guard) joins the
# same way: its `verify-clusterip-resilience.py` neuterable guard is a
# host-networking operator tool, not shipped `src/`, but is a real
# decision-logic module and gets the same ≥90% floor as everything else.
# `scripts/replay_dead_lettered_index.py` (SPEC #387 P2a) joins the same way:
# deliberately OFF-surface operator tooling (kept out of
# `src/audittrace/services/**` so it never trips the ADR-049 heavy gate), but
# it is real decision logic (scope selection, dry-run/apply, the reset
# predicate) and gets the same ≥90% floor — a single-file entry, not a
# directory, since this tool lives at the `scripts/` top level rather than a
# dedicated subpackage. `scripts/backfill_pdf_signature_status.py` (#460, the
# caller-owned `check_failed` re-classify backfill) joins the same way for the
# same reason: real decision logic (ownership partition, dry-run/apply, the
# chunk-owner invariant). No other `scripts/*` module is dragged into the gate.
# `bff` (M3-WU-2, the LibreChat BFF sidecar — ADR-042 §5 Option A) joins the
# same way for the same reason: a genuinely separate top-level deployable
# (own image, own tests under `tests/bff/`), not under `src/audittrace/`, so
# without this entry the report-generation filter (this `source` list) would
# silently drop it from `coverage.xml` even though `--cov=bff` in `make test`
# instruments it during the run — the per-file gate script
# (`scripts/check-per-file-coverage.py`) only ever sees what's IN the XML.
source = [
    "audittrace",
    "scripts/deploy",
    "scripts/hooks",
    "scripts/release",
    "scripts/curator",
    "scripts/network",
    "scripts/replay_dead_lettered_index.py",
    "scripts/backfill_pdf_signature_status.py",
    # `scripts/neuter` (the fast neuter harness, SPEC v3) joins the same way:
    # public SDLC tooling under the same ≥90% per-file gate as everything
    # else, measured alongside `--cov=scripts/neuter` in `make test`/`test-cov`.
    "scripts/neuter",
    # `scripts/ci` (DEP-LOCK-AT G5: check_venv_matches_lock.py) joins the same
    # way: the fail-closed venv==lock checker is decision logic and gets the
    # same >=90% per-file floor; measured via `--cov=scripts/ci` in
    # scripts/ci/run-tests.sh.
    "scripts/ci",
    "bff",
]
branch = true
omit = ["tests/*", "*/migrations/*"]
# SQLAlchemy's asyncio layer bridges sync<->async with greenlet
# (``sqlalchemy.util.concurrency.greenlet_spawn``), so EVERY line inside an
# ``async with session_factory()`` block executes in a greenlet context.
# Without this setting coverage.py silently records none of it — measured
# 2026-07-20 (#367): routes/memory.py:1564 executed on every request and was
# reported hits=0, and the DB-touching route modules looked like the worst in
# the tree (memory.py 80.33% branch, chat.py 80.81%) purely because they were
# UNMEASURED rather than untested. `thread` is kept alongside because the
# TestClient portal and the background workers are real threads.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # Pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "UP",      # pyupgrade
    "YTT",     # flake8-2020
]
ignore = ["E501"]  # Line length handled by black

[tool.ruff.lint.per-file-ignores]
# scripts/ deliberately uses hyphenated CLI-style names (check-per-file-coverage.py,
# check-no-skipped-tests.py, audittrace-login, index-chromadb.py, ...) — a repo-wide
# convention `make lint` already scopes around (it only lints src/ + tests/). N999
# (invalid module name) only matters for importable package modules; these are
# standalone entrypoints, never `import`ed by name. Without this, the pre-commit
# ruff hook (which lints staged scripts/ files too) fails on the PRE-EXISTING
# convention the moment any scripts/*.py file is touched — TOKEN-GUARD hit this on
# scripts/check-agent-def-token-guard.py + scripts/index-chromadb.py (2026-08-11).
"scripts/*.py" = ["N999"]

[tool.ruff.lint.isort]
known-first-party = ["audittrace"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.black]
line-length = 88
target-version = ["py312"]

[[tool.mypy.overrides]]
module = "audittrace.routes.chat"
# Langfuse @observe is an untyped decorator; Request generic requires starlette stubs
disable_error_code = ["misc", "type-arg"]

[[tool.mypy.overrides]]
module = "audittrace.auth"
# FastAPI Request generic requires starlette stubs
disable_error_code = ["type-arg"]

[[tool.mypy.overrides]]
module = "audittrace.routes.mcp"
# FastAPI Request generic requires starlette stubs
disable_error_code = ["type-arg"]

[[tool.mypy.overrides]]
module = "bff.app"
# FastAPI Request generic requires starlette stubs — same class of finding
# as audittrace.auth / audittrace.routes.mcp above, surfaced by the
# pre-commit mypy hook's pinned v1.8.0 + additional_dependencies set
# (which differs from this repo's own .venv mypy/stub versions).
disable_error_code = ["type-arg"]

[[tool.mypy.overrides]]
module = "scripts.*"
ignore_errors = true
