        schema:
          default: 100
          description: Max rows (1-1000).
          maximum: 1000
          minimum: 1
          title: Limit
          type: integer
      - description: Pagination offset.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          description: Pagination offset.
          minimum: 0
          title: Offset
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - audittrace-oauth2:
        - audittrace:audit
      summary: List Sessions
      tags:
      - audit
  /system/trust-store:
    get:
      description: 'Return the metadata of the currently-stored bundle, or 404 if

        no bundle has been provisioned yet.


        Cheaper than reading the full bundle — pulls only the metadata

        sidecar object. Useful for health-style readouts and the Helm

        hook''s pre-flight idempotency check.'
      operationId: get_trust_store_metadata_system_trust_store_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Get Trust Store Metadata System Trust Store Get
                type: object
          description: TrustStoreMetadata of the currently-stored bundle
      security:
      - audittrace-oauth2:
        - audittrace:admin
      summary: Read PAdES trust-store metadata
      tags:
      - system
  /system/trust-store/refresh:
    post:
      description: "Walk the configured Builder, persist via the configured Provider,\ninvalidate the in-process ValidationContext\
        \ singleton, return the\nnew bundle's metadata.\n\nStatus codes:\n\n* 200 — bundle refreshed; response body = TrustStoreMetadata.\n\
        * 401 — missing or invalid JWT.\n* 403 — JWT lacks ``audittrace:admin``.\n* 502 — Builder unavailable (pyhanko[etsi]\
        \ missing, EU LOTL\n  unreachable, XAdES verification failed). The previously-stored\n  bundle remains in place; subsequent\
        \ signature checks continue\n  to use it. Operator can retry once upstream conditions clear.\n* 500 — Provider write\
        \ failed (MinIO down, permission issue).\n  Investigate and retry."
      operationId: refresh_trust_store_system_trust_store_refresh_post
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Refresh Trust Store System Trust Store Refresh Post
                type: object
          description: TrustStoreMetadata of the persisted bundle
      security:
      - audittrace-oauth2:
        - audittrace:admin
      summary: Refresh PAdES trust store
      tags:
      - system
  /v1/chat/completions:
    post:
      description: 'OpenAI-compatible chat completions with memory augmentation.


        Raw dict pass-through proxy: every field on the inbound request is

        forwarded to llama-server unchanged except ``messages``, which has the

        memory context merged into its system entry. This preserves

        ``tools``, ``tool_choice``, ``tool_calls``, ``tool_call_id``, ``name``,

        ``response_format``, ``parallel_tool_calls``, and any future OpenAI-spec

        field without code changes (ADR-024).


        No ``@log_call`` decorator on purpose — the streaming generator is

        consumed *after* this function returns, so a context-manager span here

        would close before the generator ran. The explicit ``@observe`` on

        ``_build_memory_context_with_trace`` owns the request span instead.'
      operationId: chat_completions_v1_chat_completions_post
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response Chat Completions V1 Chat Completions Post
          description: Successful Response
      security:
      - audittrace-oauth2:
        - audittrace:query
      summary: Chat Completions
      tags:
      - chat
  /v1/models:
    get:
      description: 'Proxy GET /v1/models to llama-server.


        OpenAI-compatible clients (OpenCode, Continue) call this to discover

        available models before sending chat completions. FLEET-ROUTE: an

        optional ``?model=`` query param lets a caller ask which models a

        SPECIFIC routed engine serves (e.g. ``?model=mistral`` to list the

        Mistral upstream''s models) — additive, defaults to the unrouted

        ``llama_url`` behaviour so existing callers are unaffected.'
      operationId: list_models_v1_models_get
      parameters:
      - in: query
        name: model
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response List Models V1 Models Get
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - audittrace-oauth2:
        - audittrace:query
      summary: List Models
      tags:
      - chat
tags:
- description: 'OpenAI-compatible chat completions proxy. The default POST shape is intentionally permissive (raw dict pass-through)
    per ADR-024 to preserve unknown tool-calling fields. Memory augmentation is merged into the system message; an opt-in
    ``X-Persist-Mode: async`` header (ADR-046) routes the audit-row write through Redis Streams instead of the synchronous
    Postgres write on the response path.'
  name: chat
- description: Build the augmented system context across the four per-user memory layers (episodic, procedural, conversational,
    semantic) without going through chat completions — this is the ``memory_mode=inject`` aggregator (ADR-025) and does NOT
    include Layer 5, the Shared Corpus (production runs ``memory_mode=tools``, where recall — including Layer 5 — happens
    via the ``recall_*`` tools inside the chat-completions tool-call loop instead; see the top-level API description). Used
    by the webui memory tab and by external agents that want to inspect what would be injected.
  name: context
- description: Backoffice CRUD over the five-layer memory model (ADR-062) — this is the operator/audit management surface,
    NOT where LLM recall happens (see the top-level API description for that). Episodic = ADRs, Procedural = skill files,
    Conversational = past sessions (read-only), Semantic = ChromaDB-backed RAG. Layers 1-4 are designed per-user-isolated
    (episodic/procedural S3-tier wiring + semantic per-user source vectors ship in ADR-062 Phase B; conversational RLS and
    semantic recall filtering are already live). ``POST /memory/index`` bulk-rebuilds Layer 5 (the Shared Corpus — decisions/skills/semantic
    collections) and is admin-only. Every operation here — read, list, write, delete — emits a first-class audit row (``event_class=memory_access``,
    ``GET /interactions``), owner-scoped and trace-linked (ADR-062 §5). Deletes default to soft-delete (manifest tombstone,
    the authoritative + recoverable + recall-honoured state for corpus content per ADR-062 §6); ``?hard=true`` additionally
    purges the underlying S3 object / ChromaDB vector and requires ``audittrace:admin``. Each write is scoped to the caller's
    Keycloak ``sub`` and gated by RLS at the Postgres + ChromaDB layers.
  name: memory
- description: Save + summarise full chat sessions for replay and audit. Used by the OpenCode bridge to land long-running
    conversations into the conversational layer.
  name: session
- description: 'Read-only audit endpoints: ``/interactions`` returns every chat-completion row with token counts, status,
    failure-class, and trace_id; ``/sessions`` aggregates them by session. EU-AI-Act Article 12 compliance hook.'
  name: audit
- description: Kubernetes-grade liveness + metrics endpoints. ``/health`` surfaces the summariser ctx-window and async-persist
    runtime state alongside the standard component checks.
  name: health
- description: ADR-063 Phase 1 — the read/recall memory tools exposed over a standard MCP transport (streamable-HTTP, JSON-RPC
    2.0 on ``POST /mcp``) so any MCP-speaking agent can use the audited tool backend without giving up the audit trail. Purely
    additive to ``/v1/chat/completions``. Every ``tools/call`` is authorized per-tool against the caller's Keycloak scopes,
    executed under the caller's isolated RLS context, and recorded through the SAME tamper-evident audit path the chat tool
    loop uses (ADR-037/058) — one interaction + one tool_calls row per call. No write/curation tools are ever listed or callable
    here, regardless of caller privilege; later phases add those under operator-tier scopes.
  name: mcp
