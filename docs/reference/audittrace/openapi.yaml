  /memory/upload:
    post:
      description: "Upload a file to MinIO under the specified memory layer.\n\nTwo paths (Luis 2026-05-10, ADR-048 PR-B3):\n\
        \n* **PDF uploads** (``content-type: application/pdf`` AND\n  magic-byte sniff matches ``%PDF-``) take the quarantine\
        \ flow:\n  bytes land in ``quarantine/<user>/<scan_id>/<file>`` (not the\n  requested ``layer`` prefix), a ``memory_items``\
        \ row is inserted\n  with ``scan_status='pending_scan'``, and an AMQP scan-request is\n  enqueued. The response is\
        \ **HTTP 202** with a ``scan_id`` and\n  poll URL. Promotion to ``episodic/papers/`` happens\n  asynchronously in\
        \ content-control once the verdict is clean. This\n  branch is UNCHANGED by ADR-062 Phase B — the async quarantine\
        \ →\n  verdict → promotion pipeline is ADR-048's content-control\n  concern, out of WU-B4/WU-B5's scope.\n\n* **Non-PDF\
        \ uploads** (markdown skills, ADRs, plain text): ADR-062\n  Phase B (WU-B5) — writes to the caller's PRIVATE tier\
        \ via the\n  episodic/procedural service's own ``write()`` (already wired to\n  the private bucket by WU-B2), closing\
        \ a leak where every non-PDF\n  upload used to land unconditionally in the shared/corpus bucket\n  regardless of who\
        \ uploaded it. Neither layer has a declared\n  corpus-write scope (ADR-062 §4's frozenset is exactly\n  decisions/skills/semantic),\
        \ so ``?promote=corpus`` is rejected\n  with 400 rather than silently accepted or silently ignored.\n\n* **``layer=session``\
        \ uploads** (WU-1, Sovereign-Attach EPIC): a\n  THIRD case of the non-PDF branch — writes to the Postgres-backed,\n\
        \  per-user, EPHEMERAL session layer instead of S3\n  (``services/session_memory.py``). PDF content is refused for\
        \ this\n  layer (400) rather than routed into the quarantine pipeline above:\n  that pipeline promotes a clean verdict\
        \ into ``episodic/papers/``\n  (DURABLE) regardless of the ``layer`` query param — silently\n  letting it through\
        \ would let a token holding ONLY\n  ``memory:session:write`` (nothing durable) land content durably\n  anyway, defeating\
        \ this WU's least-privilege wall.\n\nAuthorization (per-layer): the caller's JWT must carry\n``memory:<layer>:write``\
        \ matching the ``layer`` query parameter\n(or ``audittrace:admin``). A token with ``memory:procedural:write``\ncannot\
        \ upload to ``layer=episodic`` and vice-versa; a token with\nONLY ``memory:session:write`` cannot upload to any durable\
        \ layer.\nThis is enforced by ``_require_layer_write`` on the first line below\n— the endpoint is **not** auth-only\
        \ despite the static ``scopes=[]``\non the OAuth2 declaration (which exists only so the spec lists the\nsecurity scheme;\
        \ the effective scope is dynamic in the ``layer``\nparameter, so it cannot be declared statically — same contract\
        \ as\n``/memory/index``)."
      operationId: upload_memory_file_memory_upload_post
      parameters:
      - in: query
        name: layer
        required: true
        schema:
          $ref: '#/components/schemas/MemoryLayer'
      - in: query
        name: filename
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Filename
      - description: Set to 'corpus' to request a corpus-tier write. Neither episodic nor procedural has a corpus-write scope
          declared (ADR-062 §4) — any corpus request here returns 400.
        in: query
        name: promote
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Set to 'corpus' to request a corpus-tier write. Neither episodic nor procedural has a corpus-write
            scope declared (ADR-062 §4) — any corpus request here returns 400.
          title: Promote
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_memory_file_memory_upload_post'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Upload Memory File Memory Upload Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - audittrace-oauth2:
        - memory:episodic:write
      - audittrace-oauth2:
        - memory:procedural:write
      - audittrace-oauth2:
        - audittrace:admin
      summary: Upload Memory File
      tags:
      - memory
