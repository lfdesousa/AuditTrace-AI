  securitySchemes:
    audittrace-oauth2:
      flows:
        authorizationCode:
          authorizationUrl: /protocol/openid-connect/auth
          scopes:
            audittrace:admin: 'Operator-grade administration: /memory/upload, /memory/index, hard-delete, configuration introspection.
              Optional scope on user-facing clients; never granted by default.'
            audittrace:assessment:ingest: Record a security self-assessment as audit events (ADR-058 recursive self-audit);
              a write grant distinct from the broad :audit read scope
            audittrace:audit: Read interactions, sessions, and tool-call audit rows
            audittrace:context: Read context-builder output for a query
            audittrace:index: Trigger semantic-store reindex (legacy dev client)
            audittrace:query: Issue chat completions and inference queries
            audittrace:scan:retrigger: Force a re-scan of an object in the ingestion content-control pipeline (ADR-048 operator
              surface). Admin-grade; never granted by default.
            memory:conversational:read-own: Read your own past conversations from the conversational layer
            memory:corpus:decisions:read: Read the shared-corpus ``decisions`` collection (Layer 5, ADR-062 §4) — distinct
              from the per-user memory:semantic:read.
            memory:corpus:decisions:write: Create/update/delete documents in the shared-corpus ``decisions`` collection (Layer
              5, ADR-062 §4). Operator/curator-tier; never granted by default.
            memory:corpus:semantic:read: Read the shared-corpus ``semantic`` collection (Layer 5, ADR-062 §4) — distinct from
              the per-user memory:semantic:read.
            memory:corpus:semantic:write: Create/update/delete documents in the shared-corpus ``semantic`` collection (Layer
              5, ADR-062 §4). Operator/curator-tier; never granted by default.
            memory:corpus:skills:read: Read the shared-corpus ``skills`` collection (Layer 5, ADR-062 §4) — distinct from
              the per-user memory:semantic:read.
            memory:corpus:skills:write: Create/update/delete documents in the shared-corpus ``skills`` collection (Layer 5,
              ADR-062 §4). Operator/curator-tier; never granted by default.
            memory:decisions:write: Create/update/delete documents in the ``decisions`` ChromaDB collection (ADR/decision
              records — vector-searchable via /memory/index single-file mode and recall_semantic).
            memory:episodic:read: Read episodic-layer (ADR-style) documents
            memory:episodic:write: Create/update/delete episodic-layer documents
            memory:procedural:read: Read procedural-layer (SKILL-style) documents
            memory:procedural:write: Create/update/delete procedural-layer documents
            memory:semantic:read: Read semantic-layer (vector) documents
            memory:semantic:write: Create/update/delete semantic-layer documents
            memory:session:write: Create documents in the per-user EPHEMERAL session memory layer ONLY (WU-1, Sovereign-Attach
              EPIC) — NOT durable memory. Grants no access to episodic, procedural, semantic, or corpus layers. Promoting
              session content to a durable layer requires a separate durable memory:<layer>:write scope via the explicit promote
              action (deferred; WU-4).
            memory:skills:write: Create/update/delete documents in the ``skills`` ChromaDB collection (SKILL/procedural records
              — vector-searchable via /memory/index single-file mode and recall_semantic).
            memory:upload:write: Upload bytes (PDFs, etc.) into the ingestion content-control pipeline (ADR-048). Distinct
              from memory:episodic:write because uploads land in a quarantine prefix the memory-server cannot read; promotion
              to episodic/papers/ happens only after a scanner verdict.
          tokenUrl: /protocol/openid-connect/token
      type: oauth2
info:
  description: 'EU-AI-Act-aligned audit trail for LLM workloads. OpenAI-compatible ``/v1/chat/completions`` proxy over a five-layer
    memory model (ADR-062): four per-user-isolated layers — episodic, procedural, conversational, semantic — plus Layer 5,
    the Shared Corpus (org-wide knowledge, shared-read, operator/curator-tier write). Keycloak-delegated identity, Postgres
    RLS per-user isolation, opt-in Redis-Streams async persistence (ADR-046), and a first-class audit event on every memory
    read/list/write/delete (ADR-062 §5 — ``event_class=memory_access`` on ``GET /interactions``).


    Recall (the LLM reading its own memory) happens through the ``recall_*`` tools inside the ``/v1/chat/completions`` tool-call
    loop (ADR-025) and through ``POST /context`` (the legacy ``inject``-mode aggregator) — NOT through the ``memory`` tag''s
    backoffice CRUD endpoints, which are the operator/audit surface for managing memory content directly.


    See ``docs/architecture/`` for C4 + sequence diagrams; the ADR set (014–062) is the source of truth for design decisions.'
  title: AuditTrace-AI
openapi: 3.1.0
paths:
  /assessments:
    post:
      description: 'Record a security self-assessment as first-class audit events (ADR-058).


        The recorder becomes a witness to its own governability: the assessment

        is written through the recorder''s own front door, under a dedicated

        least-privilege scope (``audittrace:assessment:ingest``, distinct from

        the broad ``audittrace:audit`` read scope), as owner-scoped,

        trace-linked ``assessment`` rows. Recording it this way IS the

        assessment''s rules-of-engagement evidence.'
      operationId: create_assessment_assessments_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentIngestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
