  /memory/index:
    post:
      description: "Read documents from MinIO and push chunked embeddings to ChromaDB.\n\nTwo modes:\n\n* **Bulk** (default\
        \ — no ``file``): rebuilds each named collection\n  via delete-and-recreate. ``collections`` is comma-separated;\n\
        \  defaults to ``decisions,skills,semantic`` (all ``.md``-only).\n* **Single-file** (``?file=<key>``): idempotent\
        \ upsert of one\n  MinIO object into the named collection. Operators use this in\n  a per-file client loop for the\
        \ ``ai_research_papers`` collection\n  so each request's working set stays within the request-handler's\n  memory\
        \ budget.\n\nThe opt-in ``ai_research_papers`` collection extracts text per page\nfrom PDFs and is rebuilt only when\
        \ explicitly named in\n*collections* — keeping routine /memory/index calls fast.\n\nAuthorization:\n\n* Bulk mode\
        \ (``?file`` absent) — destructive whole-collection\n  delete-and-recreate; cross-user by design. Requires\n  ``audittrace:admin``.\n\
        * Single-file mode (``?file=<layer>/<key>``) — one-document\n  idempotent upsert. Requires ``memory:<layer>:write``\
        \ matching\n  the file's MinIO prefix (or ``audittrace:admin``). The empty\n  static ``scopes=[]`` keeps OAuth2 declared\
        \ in the OpenAPI\n  spec; the prose contract lives here."
      operationId: index_memory_memory_index_post
      parameters:
      - in: query
        name: collections
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Collections
      - description: Optional MinIO object key (e.g. ``episodic/papers/foo.pdf``). When set, only this single object is indexed
          via idempotent upsert into the named collection — used by the per-file client loop pattern that keeps memory bounded
          for the PDF corpus. The collection is NOT delete-and-recreated in this mode; existing chunks for other files are
          preserved.
        in: query
        name: file
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional MinIO object key (e.g. ``episodic/papers/foo.pdf``). When set, only this single object is
            indexed via idempotent upsert into the named collection — used by the per-file client loop pattern that keeps
            memory bounded for the PDF corpus. The collection is NOT delete-and-recreated in this mode; existing chunks for
            other files are preserved.
          title: File
      - description: 'Tier-C item #24 (ADR-056). When true, the response includes a ``documents`` array carrying per-document
          outcomes — file, chunks written, signature_status, page_count, extraction_warnings, document_sha256, the ADR-056
          #10 metadata fields (pdf_title, pdf_author, pdf_creator, pdf_creation_date), ok/error. Default ``false`` keeps the
          legacy response shape for backwards compatibility. Bulk indexes can produce large ``documents`` arrays; use opt-in
          for clients that want the detail.'
        in: query
        name: details
        required: false
        schema:
          default: false
          description: 'Tier-C item #24 (ADR-056). When true, the response includes a ``documents`` array carrying per-document
            outcomes — file, chunks written, signature_status, page_count, extraction_warnings, document_sha256, the ADR-056
            #10 metadata fields (pdf_title, pdf_author, pdf_creator, pdf_creation_date), ok/error. Default ``false`` keeps
            the legacy response shape for backwards compatibility. Bulk indexes can produce large ``documents`` arrays; use
            opt-in for clients that want the detail.'
          title: Details
          type: boolean
      - description: 'Tier-C item #23 (ADR-056). When true, the request walks every PDF through the full extraction + signature
          + metadata pipeline but does NOT upsert chunks into ChromaDB and does NOT write the manifest row. Useful for previewing
          what would happen — pairs naturally with ``details=true`` to surface the per-document outcome the writer would have
          produced. Default ``false`` performs the full write.'
        in: query
        name: dry_run
        required: false
        schema:
          default: false
          description: 'Tier-C item #23 (ADR-056). When true, the request walks every PDF through the full extraction + signature
            + metadata pipeline but does NOT upsert chunks into ChromaDB and does NOT write the manifest row. Useful for previewing
            what would happen — pairs naturally with ``details=true`` to surface the per-document outcome the writer would
            have produced. Default ``false`` performs the full write.'
          title: Dry Run
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Index Memory Memory Index Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - audittrace-oauth2:
        - memory:episodic:write
      - audittrace-oauth2:
        - memory:procedural:write
      - audittrace-oauth2:
        - audittrace:admin
      summary: Index Memory
      tags:
      - memory
