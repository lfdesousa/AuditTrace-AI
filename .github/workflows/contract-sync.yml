name: Contract Sync

# Vendored-contract pin check, AT-AI side. No token, no network.
#
# AT-AI vendors a copy of audittrace-content-control's contracts/v1.yaml at
# docs/reference/content-control/contracts/v1.yaml, pinned by the sibling
# v1.yaml.source (repo, commit, sha256). This job verifies the vendored file
# still equals its pin, so an accidental edit fails here and re-vendoring is
# a deliberate act (file AND pin).
#
# The content-control repo is private, so this public repo never fetches it.
# The DRIFT detector (canonical vs vendored) lives on the private side:
# content-control's own .github/workflows/contract-sync.yml reads this repo's
# public vendored copy anonymously and diffs it against its canonical.
#
# Triggers: PR and push to main only. The old daily cron existed to catch
# upstream drift while AT-AI was idle; with no upstream read it would re-run
# an identical offline check on an unchanged tree, so it is dropped (the
# private-side guard owns time-based drift detection).

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-contract-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify vendored contract against its pin
        run: ./scripts/check-contracts-sync.sh
