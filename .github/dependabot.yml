version: 2
updates:
  # Python dependencies (pyproject.toml + the hashed locks at root).
  # DEP-LOCK-AT (ADR-065): direct pins are `==`, so a Dependabot PR bumps
  # pyproject.toml; the hashed locks are then recompiled with `make lock` and
  # `lock-check` (a REQUIRED check) fails closed on a PR that did not (operator
  # ruling Q3/Q4 — verify Dependabot's handling on its first post-merge PR).
  # Dependabot covers `/` ONLY: bff/requirements.in, images/llm-stub/
  # requirements.in, requirements-build.in and requirements-gate.in move only
  # through the deliberate `make lock-upgrade` unit (spec gate C8).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "python"

  # Dockerfile base images (root Dockerfile + any in subdirs)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"

  # docker-compose.yml + docker-compose.dev.yml image tags
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker-compose"

  # GitHub Actions workflows in .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "github-actions"
