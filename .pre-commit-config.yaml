repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        # Vendored upstream content must match source byte-for-byte so
        # diffs against upstream stay readable.
        exclude: ^docs/reference/
      - id: end-of-file-fixer
        exclude: ^docs/reference/
      - id: check-yaml
        exclude: ^charts/
      - id: check-added-large-files
        # OpenAI's OpenAPI spec is ~2.5MB. Vendoring it is load-bearing
        # (see docs/reference/openai/README.md — North Star for API
        # compatibility reviews). Bump the per-file cap and exempt the
        # spec explicitly so the refresh script needs no special casing.
        args: ['--maxkb=3000']
        exclude: ^docs/reference/openai/openapi\.yaml$

  # Local gate that flags private/legal content (customer names,
  # contact details, pricing) before it lands in the public repo.
  # Per feedback_pitch_public_vs_private: this gate enforces the rule
  # mechanically rather than relying on memory. Patterns + exceptions
  # live in scripts/check-no-private-content.sh.
  - repo: local
    hooks:
      - id: no-private-content
        name: no private/legal content in public repo
        entry: scripts/check-no-private-content.sh
        language: script
        pass_filenames: false
        always_run: true

      # DEP-LOCK-AT C5 — ruff and mypy are `repo: local`, `language: system`,
      # run through the make targets so the hook uses the SAME venv ruff/mypy
      # (from the hashed lock) as `make lint` / `make typecheck`. The old
      # `ruff-pre-commit` / `mirrors-mypy` repos built their OWN unpinned
      # environments (mypy 2.3.1 on fastapi 0.141.1 vs the venv's 2.3.0 on
      # 0.140.7: two type-checkers, two worlds). pass_filenames: false stops
      # staged paths being handed to make as targets; require_serial matches the
      # semgrep hook below. AUTOFIX IS DROPPED from the hook (check-only, so a
      # commit never silently rewrites staged files): run `make format` to fix.
      - id: ruff
        name: ruff check + format check (make lint-ruff; venv ruff from the lock)
        entry: make lint-ruff
        language: system
        files: \.py$
        pass_filenames: false
        require_serial: true

      - id: mypy
        name: mypy (make typecheck; venv mypy from the lock)
        entry: make typecheck
        language: system
        files: \.py$
        pass_filenames: false
        require_serial: true

      # Offline, deterministic semgrep security-lint gate (#382, ADR-059
      # WS1). Mirrors CodeQL's py/incomplete-url-substring-sanitization
      # LOCALLY so the WS2 class of finding is caught before the PR, not
      # after push. Invokes `make security-lint` so the rules, flags, and
      # targets are byte-identical to the local `make lint` and the CI
      # step (single source of truth = ci/semgrep/rules.yml + the Makefile
      # target). Vendored rules only — no network, no `--config auto`.
      # Fires whenever a tracked .py file changes; scans the full
      # src/ tests/ scripts/ set (pass_filenames: false).
      - id: semgrep-security-lint
        name: semgrep security-lint (offline vendored rules — #382)
        entry: make security-lint
        language: system
        files: \.py$
        pass_filenames: false
        require_serial: true

      # TOKEN-GUARD layer 3 (SEC / mechanical-inviolability, SPEC
      # token-guard-kill-show-20260811). Fails any agent def still teaching
      # the raw `audittrace-login --show` form or a direct tokens.json read.
      # always_run + pass_filenames: false is DELIBERATE and load-bearing:
      # the real targets (.claude/agents/*.md, .claude/settings.local.json,
      # the private sdlc/agents/** fleet defs) are gitignored or a foreign
      # repo entirely, so `git diff --cached` never lists any of them — a
      # staged-files hook would silently never fire on the files that
      # matter. Runs on EVERY commit instead, scanning the fixed
      # absolute/config locations (see scripts/check-agent-def-token-guard.py
      # module docstring). A guard nothing ever runs automatically is
      # equivalent to prose, not a gate — this closed the 2026-08-11 REJECT
      # (`feedback_policies_must_be_mechanically_inviolable`).
      - id: token-guard
        name: TOKEN-GUARD agent-def drift guard (ADR-059 layer 3)
        entry: make token-guard
        language: system
        always_run: true
        pass_filenames: false

      # ADR-049 — Test, Evidence, and Reconstructibility Gate.
      # Refuses commits to src/audittrace/routes/** or
      # src/audittrace/services/** that lack an evidence reference
      # (PR URL, evidence-file path, or 32-hex-char trace ID) in
      # the commit message. The commit-msg stage gives the script
      # access to the message file as $1. Per ADR-049 §Decision
      # rule 4: NO override — fix the friction, do not bypass the
      # gate. Companion enforcement: PR template + CI evidence-check
      # job in .github/workflows/ci.yml.
      - id: commit-evidence
        name: ADR-049 commit-evidence gate (routes/services touch requires evidence ref)
        entry: scripts/check-commit-evidence.sh
        language: script
        stages: [commit-msg]
        pass_filenames: true

      # C4 model lint — both workspaces shipped a latent parse bug because
      # they had never been linted. Only fires when a Structurizr .dsl
      # changes; runs the headless validate via the new tooling (requires a
      # local Docker daemon). Mirrors the structurizr-validate CI job.
      - id: structurizr-validate
        name: structurizr validate (C4 DSL)
        entry: bash -c 'docker run --rm -v "$PWD/docs/architecture":/usr/local/structurizr structurizr/structurizr:2026.05.16 validate -workspace /usr/local/structurizr/workspace.dsl'
        language: system
        files: ^docs/architecture/.*\.dsl$
        pass_filenames: false
