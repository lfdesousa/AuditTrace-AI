# M3-WU-3c (D2) — the laptop reference-infra profile for the console.
#
# M3-WU-D2-5E (2026-09-02) — DHCP-proof front-door DNS. This file used to
# pin `console.librechat.frontDoorHostAlias` to the node's LAN IP
# (`192.168.1.231`), rendered into a pod `hostAliases` entry that
# OVERRIDES CoreDNS. An overnight DHCP renewal moved the host IP to
# `10.12.40.59` on 2026-09-01, the pinned entry went dead, and
# LibreChat's own one-shot (no-retry) OIDC discovery fetch failed
# permanently for the process life — HARD DOWN login
# (`Unknown authentication strategy "openid"`). The static-IP pin is GONE
# (`feedback_no_static_host_ip_pin_resolve_by_name`); front-door hosts now
# resolve via a chart-templated `coredns-custom` overlay
# (templates/dns/configmap-coredns-frontdoor.yaml) that rewrites them to
# `console.frontDoorNodeName` below — the k3s NODE NAME, which k3s's
# built-in CoreDNS already tracks to the node's CURRENT IP via NodeHosts
# (reloaded every 15s, self-healing, no pod restart needed on the next
# DHCP change).
#
# `console.frontDoorNodeName` is committed here (rather than resolved
# live via `kubectl get nodes`) for the same reproducible-
# `helm upgrade -f values-laptop.yaml ...` reason `frontDoorHostAlias`
# was originally pinned for (portability invariant —
# [[project_portability_invariant]]: laptop is the reference profile, a
# cloud target gets its own values-<target>.yaml sibling carrying its own
# node name / Service-DNS routing, never a hardcode in core templates).
# Value: the k3s node's registered name — this host has no `--node-name`
# override in /etc/systemd/system/k3s.service, so k3s derives it from the
# OS hostname (`pcLuisLinux`); kubelet's hostname resolution lowercases
# it per Kubernetes' RFC 1123 node-name requirement (node names must be
# valid lowercase DNS labels) to `pcluislinux`. **Verify with
# `kubectl get nodes` before the first real `helm upgrade` under this
# WU** — this value could not be confirmed against a live cluster from
# this build (deploy/verify explicitly deferred to a later operator-gated
# session, per the D2-5E build round's hard constraints).
#
# M3-WU-3d (D4) — `console.librechat.host` is committed here too (even
# though it equals values.yaml's own default) so this file stays the
# single reproducible `helm upgrade -f values-laptop.yaml ...` command
# for the laptop reference target — no value an operator has to remember
# to also pass on the command line.
#
# M3-WU-D2-5F (2026-09-02) — `console.enabled: true` folded in. The
# rev-262/263 deploys (2026-08-31/09-01) needed a hand
# `--set console.enabled=true` on top of this file every time — a CD
# agent detail that is easy to forget (rev 263's console.enabled had
# regressed to orphan pods from a failed prior release exactly because
# the flag was never durable). `values.yaml`'s own default stays
# `console.enabled: false` (console is opt-in for a bare memory-server-
# only install); this laptop profile is the one reference target where
# the console IS the point, so it flips the switch here instead of at
# the CD agent's fingertips. The BFF `--set-string` secret re-pass this
# same round of deploys needed is fixed separately by the
# `secret-bff.yaml` preserve guard (this WU, item 2) — not a
# values-laptop.yaml concern, since the value itself is never committed
# to any values file.
console:
  enabled: true
  frontDoorNodeName: "pcluislinux"
  librechat:
    host: "librechat.audittrace.local"
