{{- if .Values.keycloak.enabled }}
# Helm post-install / post-upgrade Job that provisions the three
# `memory:<layer>:write` Keycloak scopes onto the running realm
# and binds them to the right clients.
#
# Why this Job exists: `kc.sh start --import-realm` only imports a
# realm on its FIRST run; later realm.json edits do not propagate
# to an existing realm. Without this Job, every chart upgrade that
# adds a new scope to realm.json would silently leave the running
# realm unchanged, and the `/memory/<layer>` write endpoints would
# 403 every operator JWT (since `require_scope` in `auth.py:174`
# does a strict scope check with no admin bypass).
#
# Lifecycle: same as the summariser-role Job —
# `helm.sh/hook: post-install,post-upgrade` runs after the main
# resources are reconciled. Hook-weight 20 (after summariser at 10)
# so the Job orders predictably in `kubectl get jobs`. The script
# itself is idempotent, so being run more than once on the same
# realm is a no-op.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-ensure-memory-scopes
  labels:
    {{- include "audittrace.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  # ACL WU-2c-A0 (Addendum F §4 / F1 S2-2 / F2 §4 / F3 S2-2): a Job
  # that silently retried a deterministic script failure 12x inside
  # helm's 300s --wait window surfaced only as "timed out waiting for
  # the condition" (the 2026-10-06 finding this WU closes). backoffLimit
  # 2 + restartPolicy Never means every attempt keeps its OWN Pod (and
  # log) until the next hook-creation deletes them (hook-delete-policy
  # above is hook-succeeded only), so a failure is captured, not erased.
  # activeDeadlineSeconds 290 closes on MEASURED worst-case pre-step
  # waits (TCP budget 120s + one bounded connect 5s + auth budget 80s +
  # one in-flight kcadm call 20s timeout + 5s kill-after + a 50s
  # post-auth step budget = 280s ≤ 290 < the runner's --timeout 300s
  # default, config.py). A deadline kill is now a NAMED `signal-term`
  # line (the script's script-wide TERM trap), never silent.
  backoffLimit: 2
  activeDeadlineSeconds: 290
  template:
    metadata:
      labels:
        {{- include "audittrace.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ensure-memory-scopes
        # Keycloak's AuthorizationPolicy gates ingress to port 8080
        # — the Job's SA is added to the allowlist in
        # templates/istio/authorizationpolicy-keycloak.yaml so it
        # can talk to the Keycloak Service.
        sidecar.istio.io/inject: "true"
      annotations:
        {{- if .Values.vault.enabled }}
        {{- include "audittrace.vaultAnnotations.memoryScopesJob" . | nindent 8 }}
        {{- end }}
    spec:
      restartPolicy: Never
      # Explicit (the template set none before — the K8s default of 30s
      # was implicit): the script's `acl_e2e_kc` wrapper's default
      # per-call timeout (20s) + `timeout -k 5` kill-after must stay
      # below this value (pinned, F1 AC-F8 superseded by F2 S2-3:
      # 20 + 5 < 30) so a hung kcadm call is always reaped by the
      # script itself before kubelet's SIGKILL would otherwise land on
      # a process with no chance left to print the named line.
      terminationGracePeriodSeconds: 30
      serviceAccountName: {{ .Release.Name }}-memory-scopes-job
      containers:
        - name: kcadm
          image: "{{ .Values.keycloak.image.repository }}:{{ .Values.keycloak.image.tag }}"
          # `curl` ships with the Keycloak image; `kcadm.sh` lives
          # at /opt/keycloak/bin. Nothing else to install.
          env:
            - name: KC_BASE_URL
              value: "http://{{ .Release.Name }}-keycloak:8080"
            - name: REALM
              value: "audittrace"
            # ACL WU-2c: the dedicated E2E client's sunset flag — the script
            # reads it (default true); enabled -> ensure+verify, disabled ->
            # verify-then-delete.
            - name: AUDITTRACE_ACL_E2E_CLIENT_ENABLED
              value: {{ .Values.keycloak.aclE2eClient.enabled | quote }}
            # ACL WU-2c-A0 (Addendum F §3 / F1 §5): read-only, GET-only
            # shape capture of the E2E client's live Keycloak
            # representation (key names + typed, redacted values —
            # never a value) — default off; the re-enable deploy flips
            # it on so the real layout lands in the evidence without
            # ever printing a secret.
            - name: AUDITTRACE_ACL_E2E_SHAPE_CAPTURE
              value: {{ ternary "1" "0" .Values.keycloak.aclE2eClient.shapeCapture | quote }}
            {{- if not .Values.vault.enabled }}
            # vault.enabled=false branch — K8s Secret. When
            # vault.enabled=true KEYCLOAK_ADMIN_PASSWORD lands at
            # runtime via /vault/secrets/env, sourced inside the
            # script (ADR-043 §4).
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-keycloak-secret
                  key: admin-password
            {{- end }}
          volumeMounts:
            - name: script
              mountPath: /work
              readOnly: true
          command:
            - bash
            - /work/ensure-memory-scopes.sh
      volumes:
        - name: script
          configMap:
            name: {{ .Release.Name }}-memory-scopes-script
            defaultMode: 0755
{{- end }}
