{{- if .Values.keycloak.enabled }}
# kcadm bash script consumed by the post-install/post-upgrade
# `ensure-memory-scopes` Job (ADR-XXX — memory CRUD backoffice).
#
# Why a separate ConfigMap rather than inlining the script in the
# Job manifest: the script is ~100 lines and we want it diffable in
# `git log` without touching the Job's spec each time the kcadm
# logic evolves. Same factoring as
# `templates/postgres/configmap-summariser-sql.yaml`.
#
# The script is idempotent — safe to re-run on every helm upgrade
# (which is what the post-upgrade hook does). It only ever creates
# missing scopes / missing client bindings; never deletes or
# rewrites existing realm content — EXCEPT Step 6 (M3-WU-D2-5D)
# below, which deliberately SETS (not merely ensures-present) the
# `audittrace-librechat` client's `redirectUris`/`webOrigins` to the
# config-as-code target on every upgrade. That is a narrow, named
# exception: reconciling exactly those two fields on that one client
# is the whole point of Step 6 (killing redirect-URI drift), never a
# general license to rewrite other realm content.
#
# Step 4 (M3-WU-2b) additionally provisions the RFC 8693 token-exchange
# fine-grained admin permission that authorizes `audittrace-librechat-bff`
# to exchange a caller's own token — same "realm.json only imports on
# first run" rationale as Steps 1-3, folded into this Job rather than a
# new one to avoid new Vault-role/Istio-AuthorizationPolicy surface for
# what is, functionally, the same "harden the running realm after
# --import-realm" concern.
#
# Step 6 (M3-WU-D2-5D, 2026-09-01) reconciles `audittrace-librechat`'s
# `redirectUris`/`webOrigins` to the value `console.librechat.host`
# derives on every upgrade — closing the 2026-08-31 incident where an
# operator hand-added a callback URL in the Keycloak admin console
# because realm.json's updated redirect URI never reached the running
# realm (`--import-realm` only imports on first run — the identical
# gap Steps 1-5 close for scopes/mappers/token-exchange).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-memory-scopes-script
  labels:
    {{- include "audittrace.labels" . | nindent 4 }}
data:
  ensure-memory-scopes.sh: |
    #!/usr/bin/env bash
    # Ensure the three `memory:<layer>:write` Keycloak scopes exist on
    # the audittrace realm and are attached to the right clients.
    #
    # The chart's `realm-audittrace.json` declares these scopes, but
    # `kc.sh start --import-realm` only imports on a FRESH realm — it
    # does NOT propagate updates to an existing realm. Without this
    # Job, every upgrade that adds a scope to realm.json silently
    # leaves the running realm without it, and the `/memory/<layer>`
    # write endpoints 403 every operator JWT.
    #
    # Idempotent: every action is gated on a "does it already exist?"
    # check. Re-runs are safe (and expected on every helm upgrade).
    set -euo pipefail

    # Duplicate the REAL stdout/stderr to fd 3/4 BEFORE any later command
    # in this script redirects fd 1/2 of its own invocation (e.g. every
    # `acl_e2e_kc ... >/dev/null` call). Without this, a TERM/timeout that
    # strikes WHILE such a redirected call is in flight would have the
    # trap's own `acl-e2e:` line inherit that call's CURRENT fd 1 (the
    # `/dev/null` it was redirected to), silently losing the stdout half
    # of "exactly once on both streams" — found by this WU's own SIGTERM
    # test against the sunset-delete call. fd 3/4 are independent
    # duplicates of the ORIGINAL pipe/terminal and are never themselves
    # redirected, so acl_e2e_emit always reaches the real streams.
    exec 3>&1 4>&2

    # ----- ACL WU-2c-A0: named-failure-line diagnostics (F/F1/F2/F3) -----
    # Every exit path of this script — an explicit refusal, an implicit
    # `set -e`/`-u`/`pipefail` exit, a Job SIGTERM/SIGKILL landing on a
    # stuck kcadm call, or a kcadm call that times out — prints exactly
    # one line of the form
    #   acl-e2e: code=<code> stage=<stage> rc=<rc> line=<n|?> cmd=<masked|-> detail=<non-secret>
    # to BOTH stdout and stderr before the process exits (ACL WU-2c
    # Addendum F/F1/F2/F3). `cmd=` is `$BASH_COMMAND`
    # (source text, never an expanded value) with every password token
    # masked; `detail=` is always a closed-set reason/count/path — never a
    # kcadm response body (which may carry `registrationAccessToken`) and
    # never a raw credential.
    #
    # Bootstrap tool checks run with NO trap installed yet (nothing would
    # catch their own failure) — each prints the line itself and exits.
    if ! command -v timeout >/dev/null 2>&1; then
      printf 'acl-e2e: code=timeout-missing stage=pre-step:init rc=127 line=? cmd=- detail=coreutils-timeout-not-on-PATH\n' >&3
      printf 'acl-e2e: code=timeout-missing stage=pre-step:init rc=127 line=? cmd=- detail=coreutils-timeout-not-on-PATH\n' >&4
      exit 1
    fi
    if ! command -v mktemp >/dev/null 2>&1; then
      printf 'acl-e2e: code=mktemp-missing stage=pre-step:init rc=127 line=? cmd=- detail=coreutils-mktemp-not-on-PATH\n' >&3
      printf 'acl-e2e: code=mktemp-missing stage=pre-step:init rc=127 line=? cmd=- detail=coreutils-mktemp-not-on-PATH\n' >&4
      exit 1
    fi

    ACL_E2E_REPORTED=0
    ACL_E2E_CHILD=""
    ACL_E2E_STAGE="pre-step:init"
    ACL_E2E_ERR_LINE="?"
    ACL_E2E_ERR_CMD="-"
    ACL_E2E_REPORT_FILE="$(mktemp)"
    unset ACL_E2E_VIA_KC ACL_E2E_CALL_LINE || true

    # `$BASH_COMMAND` is source text, never an expanded value — masking the
    # variable NAME here is defence in depth only; the real leak vectors
    # (`set -x`, `printenv`, `declare -p`, `cat <<<"$KEYCLOAK_ADMIN_PASSWORD"`)
    # are forbidden outright by the secret-hygiene test (AC-F2, F3 SF3-5).
    acl_e2e_mask() {
      local s="$1"
      s="${s//KEYCLOAK_ADMIN_PASSWORD/<redacted-var>}"
      # Collapse any embedded CR/LF (a malformed multi-line kcadm response
      # read naively into a value) so it can never split the one-line
      # emission across terminal lines, THEN fail closed on anything
      # token-shaped (>=3 dot-separated base64url segments, >=15 chars
      # each) that might have ridden in via a response-derived value (F
      # section 1.2: "detail= never carries a kcadm response body"; R4).
      s="${s//$'\r'/ }"
      s="${s//$'\n'/ }"
      while [[ "${s}" =~ ([A-Za-z0-9_-]{15,}\.[A-Za-z0-9_-]{15,}\.[A-Za-z0-9_-]{15,}) ]]; do
        s="${s/${BASH_REMATCH[1]}/<redacted-token>}"
      done
      printf '%s' "${s}"
    }

    # The ONE line, both streams, one shape (F2 SF-1).
    acl_e2e_emit() {
      local code="$1" rc="$2" line="$3" cmd="$4" detail="$5" msg
      msg="acl-e2e: code=${code} stage=${ACL_E2E_STAGE} rc=${rc} line=${line} cmd=$(acl_e2e_mask "${cmd}") detail=$(acl_e2e_mask "${detail}")"
      printf '%s\n' "${msg}" >&3
      printf '%s\n' "${msg}" >&4
    }

    # Preferred-cause resolver shared by the ERR/EXIT/TERM/INT paths: an
    # inner, more specific cause recorded by a nested subshell's
    # `acl_e2e_fail` always wins over a generic fallback (F2 BF1-b).
    acl_e2e_report() {
      local fallback_code="$1" rc="$2" fallback_detail="$3"
      [[ "${ACL_E2E_REPORTED}" -eq 1 ]] && return 0
      if [[ -s "${ACL_E2E_REPORT_FILE}" ]]; then
        local inner icode irc idetail
        inner="$(cat "${ACL_E2E_REPORT_FILE}" 2>/dev/null || true)"
        icode="${inner#code=}"; icode="${icode%% stage=*}"
        irc="${inner#*rc=}"; irc="${irc%% detail=*}"
        idetail="${inner#*detail=}"
        acl_e2e_emit "${icode}" "${irc}" "${ACL_E2E_ERR_LINE}" "${ACL_E2E_ERR_CMD}" "${idetail}"
      else
        acl_e2e_emit "${fallback_code}" "${rc}" "${ACL_E2E_ERR_LINE}" "${ACL_E2E_ERR_CMD}" "${fallback_detail}"
      fi
      ACL_E2E_REPORTED=1
    }

    # Explicit refusal — every `|| acl_e2e_fail <code> "<detail>"` site in
    # this script. Inside a subshell ($( ), a pipeline element, `( )`) this
    # cannot set this shell's ACL_E2E_REPORTED, so it records into the
    # parent-owned report file instead (an EXIT trap does NOT itself run
    # inside a `$( )`/`( )`/pipeline subshell on bash 5.1/5.2 — measured;
    # no `trap - EXIT` is needed to suppress a second print there) so the
    # one real top-level `|| acl_e2e_fail` prints the ONE line (F2 BF1-b;
    # AC-F14 pins that every call site sits where this holds).
    #
    # The real rc of the FAILING command the `||` just reacted to is still
    # live in $? when this function is entered — captured as the FIRST
    # statement, before any other command (even `local`) would overwrite
    # it. A timeout (124) or a delivered signal's own exit status (143/130,
    # on the rare top-level call where the trap itself never got to run
    # first) always overrides the caller's generic code, so a guard can
    # never collapse a `kcadm-timeout`/`signal-term`/`signal-int` into its
    # own more general refusal code (R3).
    acl_e2e_fail() {
      local __acl_rc=$?
      local code="$1"
      shift
      local detail="$*"
      case "${__acl_rc}" in
        124) code="kcadm-timeout" ;;
        143) code="signal-term" ;;
        130) code="signal-int" ;;
        97) code="unwrapped-call" ;;
        *) __acl_rc=1 ;;
      esac
      if [[ "${BASH_SUBSHELL}" -gt 0 ]]; then
        printf 'code=%s stage=%s rc=%s detail=%s' "${code}" "${ACL_E2E_STAGE}" "${__acl_rc}" "${detail}" > "${ACL_E2E_REPORT_FILE}"
        exit "${__acl_rc}"
      fi
      acl_e2e_report "${code}" "${__acl_rc}" "${detail}"
      exit "${__acl_rc}"
    }

    acl_e2e_on_err() {
      ACL_E2E_ERR_LINE="${BASH_LINENO[0]}"
      ACL_E2E_ERR_CMD="${BASH_COMMAND}"
    }

    acl_e2e_on_exit() {
      local rc=$?
      if [[ "${rc}" -ne 0 ]]; then
        local code="unguarded-failure"
        case "${rc}" in
          124) code="kcadm-timeout" ;;
          97) code="unwrapped-call" ;;
        esac
        acl_e2e_report "${code}" "${rc}" "unreported-exit"
      fi
      rm -f "${ACL_E2E_REPORT_FILE}" 2>/dev/null || true
    }

    acl_e2e_on_signal() {
      local sig="$1" rc=143
      [[ "${sig}" == "INT" ]] && rc=130
      [[ -n "${ACL_E2E_CHILD}" ]] && kill "${ACL_E2E_CHILD}" 2>/dev/null || true
      acl_e2e_report "signal-${sig,,}" "${rc}" "killed-by-SIG${sig}"
      rm -f "${ACL_E2E_REPORT_FILE}" 2>/dev/null || true
      exit "${rc}"
    }

    trap 'acl_e2e_on_err' ERR
    trap 'acl_e2e_on_exit' EXIT
    trap 'acl_e2e_on_signal TERM' TERM
    trap 'acl_e2e_on_signal INT' INT
    set -E

    REALM="${REALM:-audittrace}"
    KC_BASE_URL="${KC_BASE_URL:-http://{{ .Release.Name }}-keycloak:8080}"

    # Scopes provisioned onto the running realm. Kept in lockstep with
    # realm-audittrace.json's clientScopes[] block — adding a scope
    # there means adding it here too. The chart-render test
    # (`TestRealmMemoryWriteScopes` / `TestRealmAdminScope`) catches
    # drift between the two.
    #
    # `audittrace:admin` is bound here so /memory/upload + /memory/index
    # (which require it via auth.require_scope) become reachable from
    # user-facing clients (opencode/webui) when the operator opts in
    # per-session via `scope=audittrace:admin`.
    SCOPES=(
      "memory:episodic:write"
      "memory:procedural:write"
      "memory:semantic:write"
      "memory:decisions:write"
      "memory:skills:write"
      "audittrace:admin"
      "audittrace:assessment:ingest"
    )

    # ADR-062 §4 — Layer 5 (Shared Corpus) granular scopes. Separate
    # array from SCOPES above: bound ONLY to admin-client (operator/
    # curator-tier, optional) in the dedicated bind loop below — never
    # to audittrace-opencode / audittrace-webui in either scope set,
    # and never to the reserved SC-09 audittrace-restricted client
    # (WU-A3). Kept in lock-step with scripts/setup-memory-scopes.sh's
    # CORPUS_SCOPES array (tests/test_chart_drift_guards.py asserts it).
    CORPUS_SCOPES=(
      "memory:corpus:decisions:read"
      "memory:corpus:decisions:write"
      "memory:corpus:skills:read"
      "memory:corpus:skills:write"
      "memory:corpus:semantic:read"
      "memory:corpus:semantic:write"
    )

    # M3-WU-D2-1 (2026-08-30) — the Souvenirs panel's memory-proxy write
    # scopes. Bound ONLY as OPTIONAL to audittrace-librechat (never
    # default): the browser's own login token must never carry write
    # access to the store — only the BFF's memory-path RFC 8693 exchange
    # (bff/memory_scopes.py::MEMORY_SCOPE_STRING) requests them
    # explicitly. A separate array + bind loop from SCOPES above, same
    # rationale as CORPUS_SCOPES: a future edit to SCOPES (which also
    # holds audittrace:admin) must never silently widen
    # audittrace-librechat's ceiling to admin. This is the realm-side
    # half of the same drift class every other array in this script
    # exists to close: realm-audittrace.json already declares these three
    # as audittrace-librechat's optionalClientScopes (imported on FIRST
    # boot only), so a PRE-EXISTING realm needs this Job to reconcile them
    # too (tests/test_chart_drift_guards.py::TestConsoleMemoryProxyScopeGovernance).
    MEMORY_CONSOLE_WRITE_SCOPES=(
      "memory:episodic:write"
      "memory:procedural:write"
      "memory:semantic:write"
    )

    # WU-1 (Sovereign-Attach EPIC, 2026-09-03) — the ephemeral chat-upload
    # least-privilege wall. Bound ONLY as OPTIONAL to audittrace-librechat
    # (never default), in its OWN array/bind loop — kept SEPARATE from
    # MEMORY_CONSOLE_WRITE_SCOPES above on purpose:
    # TestD25AMemoryWriteScopesJobRenderedBinding asserts that array is
    # EXACTLY {episodic,procedural,semantic}:write, so folding
    # memory:session:write into it would both fail that exact-match guard
    # AND — more importantly — muddy the "durable write" vs "ephemeral-
    # only write" distinction this WU exists to make real. Only WU-2's
    # narrow upload exchange requests this scope by name.
    MEMORY_SESSION_WRITE_SCOPES=(
      "memory:session:write"
    )

    # WU-5 (Sovereign-Attach EPIC, 2026-09-06) — same-turn recall of the
    # caller's OWN ephemeral session uploads (recall_attachments). Bound as
    # DEFAULT to audittrace-librechat — deliberately UNLIKE
    # MEMORY_SESSION_WRITE_SCOPES above: this is a READ-OWN scope, the same
    # family as memory:conversational:read-own/memory:semantic:read (both
    # already DEFAULT on this client), not a write grant. The chat path's
    # plain RFC 8693 exchange (bff/exchange.py::exchange_token,
    # requested_scope=None) mints a token carrying only the TARGET client's
    # DEFAULT scopes — an OPTIONAL-only grant would never reach the /v1 tool
    # loop through that path, silently making recall_attachments
    # unreachable from the real console. Own array/bind loop so a future
    # edit to MEMORY_SESSION_WRITE_SCOPES's "optional" binding cannot
    # silently also flip this one.
    MEMORY_SESSION_READ_SCOPES=(
      "memory:session:read-own"
    )

    # Mongo-repl WU-1 (2026-09-11) — the console-conversations store's
    # write scope. Bound ONLY as OPTIONAL to audittrace-librechat (never
    # default), in its OWN array/bind loop — same "never auto-granted"
    # discipline as MEMORY_SESSION_WRITE_SCOPES above: only the BFF's
    # console-conversations proxy exchange
    # (bff/console_conversations_scopes.py::CONSOLE_CONVERSATIONS_SCOPE_STRING)
    # requests it by name.
    MEMORY_CONVERSATIONS_WRITE_SCOPES=(
      "memory:conversations:write"
    )

    # Mongo-repl WU-1 (2026-09-11) — the console-conversations store's
    # read-own scope. Bound as DEFAULT to audittrace-librechat — same
    # rationale as MEMORY_SESSION_READ_SCOPES above (a READ-OWN scope,
    # same family as memory:session:read-own/memory:conversational:
    # read-own, not a write grant; the plain chat-token exchange must
    # carry it for the console's sidebar/history to work out of the box).
    # Own array/bind loop, separate from the write array.
    MEMORY_CONVERSATIONS_READ_SCOPES=(
      "memory:conversations:read-own"
    )

    # Mongo-repl WU-presets (2026-09-11) — the console-presets store's
    # write scope. Bound ONLY as OPTIONAL to audittrace-librechat (never
    # default), in its OWN array/bind loop — same "never auto-granted"
    # discipline as MEMORY_CONVERSATIONS_WRITE_SCOPES above: only the
    # BFF's console-presets proxy exchange
    # (bff/console_presets_scopes.py::CONSOLE_PRESETS_SCOPE_STRING)
    # requests it by name.
    MEMORY_PRESETS_WRITE_SCOPES=(
      "memory:presets:write"
    )

    # Mongo-repl WU-presets (2026-09-11) — the console-presets store's
    # read-own scope. Bound as DEFAULT to audittrace-librechat — same
    # rationale as MEMORY_CONVERSATIONS_READ_SCOPES above. Own array/bind
    # loop, separate from the write array.
    MEMORY_PRESETS_READ_SCOPES=(
      "memory:presets:read-own"
    )

    # Mongo-repl WU-prompts (2026-09-11) — the console-prompts store's
    # write scope. Bound ONLY as OPTIONAL to audittrace-librechat (never
    # default), in its OWN array/bind loop — same "never auto-granted"
    # discipline as MEMORY_PRESETS_WRITE_SCOPES above: only the BFF's
    # console-prompts proxy exchange
    # (bff/console_prompts_scopes.py::CONSOLE_PROMPTS_SCOPE_STRING)
    # requests it by name.
    MEMORY_PROMPTS_WRITE_SCOPES=(
      "memory:prompts:write"
    )

    # Mongo-repl WU-prompts (2026-09-11) — the console-prompts store's
    # read-own scope. Bound as DEFAULT to audittrace-librechat — same
    # rationale as MEMORY_PRESETS_READ_SCOPES above. Own array/bind
    # loop, separate from the write array.
    MEMORY_PROMPTS_READ_SCOPES=(
      "memory:prompts:read-own"
    )

    # Chat-Projects domain (2026-09-11, MongoDB-elimination EPIC) — the
    # console-chat-projects store's write scope. Bound ONLY as OPTIONAL
    # to audittrace-librechat (never default), in its OWN array/bind
    # loop — same "never auto-granted" discipline as
    # MEMORY_PROMPTS_WRITE_SCOPES above: only the BFF's
    # console-chat-projects proxy exchange
    # (bff/console_chat_projects_scopes.py::CONSOLE_CHAT_PROJECTS_SCOPE_STRING)
    # requests it by name.
    MEMORY_CHAT_PROJECTS_WRITE_SCOPES=(
      "memory:chat_projects:write"
    )

    # Chat-Projects domain (2026-09-11) — the console-chat-projects
    # store's read-own scope. Bound as DEFAULT to audittrace-librechat —
    # same rationale as MEMORY_PROMPTS_READ_SCOPES above. Own array/bind
    # loop, separate from the write array.
    MEMORY_CHAT_PROJECTS_READ_SCOPES=(
      "memory:chat_projects:read-own"
    )

    # Files-metadata domain (2026-09-11, MongoDB-elimination EPIC) — the
    # console-files store's write scope. Bound ONLY as OPTIONAL to
    # audittrace-librechat (never default), in its OWN array/bind loop —
    # same "never auto-granted" discipline as
    # MEMORY_CHAT_PROJECTS_WRITE_SCOPES above: only the BFF's
    # console-files proxy exchange
    # (bff/console_file_records_scopes.py::CONSOLE_FILE_RECORDS_SCOPE_STRING)
    # requests it by name.
    MEMORY_FILES_WRITE_SCOPES=(
      "memory:files:write"
    )

    # Files-metadata domain (2026-09-11) — the console-files store's
    # read-own scope. Bound as DEFAULT to audittrace-librechat — same
    # rationale as MEMORY_CHAT_PROJECTS_READ_SCOPES above. Own array/bind
    # loop, separate from the write array.
    MEMORY_FILES_READ_SCOPES=(
      "memory:files:read-own"
    )

    # Agents domain (2026-09-12, MongoDB-elimination EPIC) — the
    # console-agents store's write scope. Bound ONLY as OPTIONAL to
    # audittrace-librechat (never default), in its OWN array/bind loop —
    # same "never auto-granted" discipline as MEMORY_FILES_WRITE_SCOPES
    # above: only the BFF's console-agents proxy exchange
    # (bff/console_agents_scopes.py::CONSOLE_AGENTS_SCOPE_STRING)
    # requests it by name.
    MEMORY_AGENTS_WRITE_SCOPES=(
      "memory:agents:write"
    )

    # Agents domain (2026-09-12) — the console-agents store's read-own
    # scope. Bound as DEFAULT to audittrace-librechat — same rationale
    # as MEMORY_FILES_READ_SCOPES above. Own array/bind loop, separate
    # from the write array.
    MEMORY_AGENTS_READ_SCOPES=(
      "memory:agents:read-own"
    )

    # Conversation-Tags domain (2026-09-13, MongoDB-elimination EPIC) —
    # the console-conversation-tags store's write scope. Bound ONLY as
    # OPTIONAL to audittrace-librechat (never default), in its OWN
    # array/bind loop — same "never auto-granted" discipline as
    # MEMORY_AGENTS_WRITE_SCOPES above: only the BFF's
    # console-conversation-tags proxy exchange
    # (bff/console_conversation_tags_scopes.py::CONSOLE_CONVERSATION_TAGS_SCOPE_STRING)
    # requests it by name.
    MEMORY_CONVERSATION_TAGS_WRITE_SCOPES=(
      "memory:conversation_tags:write"
    )

    # Conversation-Tags domain (2026-09-13) — the console-
    # conversation-tags store's read-own scope. Bound as DEFAULT to
    # audittrace-librechat — same rationale as MEMORY_AGENTS_READ_SCOPES
    # above. Own array/bind loop, separate from the write array.
    MEMORY_CONVERSATION_TAGS_READ_SCOPES=(
      "memory:conversation_tags:read-own"
    )

    # Tool-Favorites domain (2026-09-13, MongoDB-elimination EPIC) —
    # the console-tool-favorites store's write scope. Bound ONLY as
    # OPTIONAL to audittrace-librechat (never default), in its OWN
    # array/bind loop — same "never auto-granted" discipline as
    # MEMORY_CONVERSATION_TAGS_WRITE_SCOPES above: only the BFF's
    # console-tool-favorites proxy exchange
    # (bff/console_tool_favorites_scopes.py::CONSOLE_TOOL_FAVORITES_SCOPE_STRING)
    # requests it by name.
    MEMORY_TOOL_FAVORITES_WRITE_SCOPES=(
      "memory:tool_favorites:write"
    )

    # Tool-Favorites domain (2026-09-13) — the console-tool-favorites
    # store's read-own scope. Bound as DEFAULT to audittrace-librechat
    # — same rationale as MEMORY_CONVERSATION_TAGS_READ_SCOPES above.
    # Own array/bind loop, separate from the write array.
    MEMORY_TOOL_FAVORITES_READ_SCOPES=(
      "memory:tool_favorites:read-own"
    )

    # Sovereign Authorization Layer EPIC, WU-1 (2026-09-17, READ PATH
    # ONLY) — the console-ACL store's read-own scope. Bound as DEFAULT
    # to audittrace-librechat — same rationale as
    # MEMORY_TOOL_FAVORITES_READ_SCOPES above. Own array/bind loop,
    # separate from every other array above.
    MEMORY_ACL_READ_SCOPES=(
      "memory:acl:read-own"
    )

    # Sovereign Authorization Layer EPIC, WU-2c — the console-ACL WRITE
    # scope. Bound ONLY as OPTIONAL to audittrace-librechat (like every
    # console write scope) — own array/bind loop; the dedicated E2E
    # client gets it through its own step (never through this loop).
    MEMORY_ACL_WRITE_SCOPES=(
      "memory:acl:write"
    )

    # Vault-Agent rendered the admin password to /vault/secrets/env
    # when vault.enabled=true; otherwise it's a regular env var via
    # K8s Secret.
    {{- if .Values.vault.enabled }}
    set -a; . /vault/secrets/env; set +a
    {{- end }}

    if [[ -z "${KEYCLOAK_ADMIN_PASSWORD:-}" ]]; then
      echo "❌ KEYCLOAK_ADMIN_PASSWORD is empty — refusing to authenticate." >&2
      exit 1
    fi

    # acl-e2e-kc-begin
    # Every kcadm invocation in this script goes through this wrapper
    # (F2 BF1-a) — nothing else in either site calls kcadm.sh directly.
    # Interruptible (background + `wait` — a trapped signal interrupts
    # `wait`, F1 §1.2) and bounded (`timeout -k 5 <default 20>`, F2 S-b:
    # for the many invocations nested inside a `$(...)` command
    # substitution this per-call timeout is the ONLY mechanism, since a
    # signal to the main process is deferred until that foreground
    # subshell returns). The `ACL_E2E_VIA_KC`/`ACL_E2E_CALL_LINE`
    # environment prefix on this one command (never `export`) is the
    # dynamic primary proof that every call on an exercised path goes
    # through here (F3 §1.1): a harness fake invoked without the marker
    # fails loudly instead of passing silently.
    acl_e2e_kc() {
      local rc
      ACL_E2E_VIA_KC=1 ACL_E2E_CALL_LINE="${BASH_LINENO[0]}" \
        timeout -k 5 "${ACL_E2E_KCADM_TIMEOUT:-20}" /opt/keycloak/bin/kcadm.sh "$@" &
      ACL_E2E_CHILD=$!
      wait "${ACL_E2E_CHILD}"
      rc=$?
      ACL_E2E_CHILD=""
      return "${rc}"
    }
    # acl-e2e-kc-end

    # Keycloak rolls during a chart upgrade — wait for it to accept
    # connections before kcadm tries to authenticate.
    #
    # The Keycloak image is minimal (no curl, no wget, no netcat). We
    # use bash's built-in `/dev/tcp/<host>/<port>` to test reachability
    # at the TCP layer (bounded to 5s per attempt — F2 §1.2 point 2: an
    # OS SYN-retry black hole would otherwise cost minutes per try),
    # then poll kcadm-config-credentials to confirm the realm endpoint
    # is responding. Both waits are TIME BUDGETS, not try-counts (F3
    # S2-2): a hanging kcadm call now costs a bounded 25s per try
    # (timeout+kill-after) rather than an unbounded one, so a try-count
    # could no longer bound the worst case.
    ACL_E2E_STAGE="pre-step:tcp-wait"
    ACL_E2E_TCP_BUDGET_S="${ACL_E2E_TCP_BUDGET_S:-120}"
    KC_HOST="${KC_BASE_URL#http://}"
    KC_HOST="${KC_HOST%%:*}"
    KC_PORT="${KC_BASE_URL##*:}"
    echo "▶ waiting for Keycloak at ${KC_HOST}:${KC_PORT}..."
    ACL_E2E_TCP_DEADLINE=$(( $(date +%s) + ACL_E2E_TCP_BUDGET_S ))
    while true; do
      if timeout 5 bash -c "exec 3<>/dev/tcp/${KC_HOST}/${KC_PORT}" 2>/dev/null; then
        echo "  ✓ Keycloak TCP reachable"
        break
      fi
      if [ "$(date +%s)" -ge "${ACL_E2E_TCP_DEADLINE}" ]; then
        echo "❌ Keycloak did not become reachable within ${ACL_E2E_TCP_BUDGET_S}s." >&2
        exit 1
      fi
      sleep 2
    done

    # TCP-reachable doesn't mean the realm endpoints are serving yet —
    # Keycloak's HTTP layer comes up after the JVM finishes warming
    # the realm cache. Retry kcadm authentication for a time budget to
    # absorb the gap.
    ACL_E2E_STAGE="pre-step:auth"
    ACL_E2E_AUTH_BUDGET_S="${ACL_E2E_AUTH_BUDGET_S:-80}"
    echo "▶ authenticating to Keycloak admin..."
    ACL_E2E_AUTH_DEADLINE=$(( $(date +%s) + ACL_E2E_AUTH_BUDGET_S ))
    while true; do
      if acl_e2e_kc config credentials \
            --server "${KC_BASE_URL}" \
            --realm master \
            --user admin \
            --password "${KEYCLOAK_ADMIN_PASSWORD}" >/dev/null 2>&1; then
        echo "  ✓ authenticated"
        break
      fi
      if [ "$(date +%s)" -ge "${ACL_E2E_AUTH_DEADLINE}" ]; then
        echo "❌ kcadm authentication failed within ${ACL_E2E_AUTH_BUDGET_S}s." >&2
        # Final attempt with stderr surfaced so the Job log shows why.
        acl_e2e_kc config credentials \
          --server "${KC_BASE_URL}" \
          --realm master \
          --user admin \
          --password "${KEYCLOAK_ADMIN_PASSWORD}" || true
        exit 1
      fi
      sleep 2
    done
    ACL_E2E_STAGE="pre-step:init"

    # ── Step 1: ensure each scope exists ──────────────────────────
    #
    # The Keycloak base image is minimal — no awk, no jq, no curl.
    # We parse kcadm's CSV output with bash's `while IFS=, read`
    # builtin, which is available in every bash 4+ shell and needs
    # no external tooling.
    find_scope_id() {
      local target="$1" id name
      while IFS=, read -r id name; do
        if [[ "${name}" == "${target}" ]]; then
          echo "${id}"
          return 0
        fi
      done < <(acl_e2e_kc get client-scopes -r "${REALM}" \
                 --fields id,name --format csv --noquotes 2>/dev/null)
      return 1
    }

    declare -A SCOPE_ID
    ACL_E2E_STAGE="scope-ensure"
    for SCOPE in "${SCOPES[@]}" "${CORPUS_SCOPES[@]}" "${MEMORY_SESSION_WRITE_SCOPES[@]}" "${MEMORY_SESSION_READ_SCOPES[@]}" "${MEMORY_CONVERSATIONS_WRITE_SCOPES[@]}" "${MEMORY_CONVERSATIONS_READ_SCOPES[@]}" "${MEMORY_PRESETS_WRITE_SCOPES[@]}" "${MEMORY_PRESETS_READ_SCOPES[@]}" "${MEMORY_PROMPTS_WRITE_SCOPES[@]}" "${MEMORY_PROMPTS_READ_SCOPES[@]}" "${MEMORY_CHAT_PROJECTS_WRITE_SCOPES[@]}" "${MEMORY_CHAT_PROJECTS_READ_SCOPES[@]}" "${MEMORY_FILES_WRITE_SCOPES[@]}" "${MEMORY_FILES_READ_SCOPES[@]}" "${MEMORY_AGENTS_WRITE_SCOPES[@]}" "${MEMORY_AGENTS_READ_SCOPES[@]}" "${MEMORY_CONVERSATION_TAGS_WRITE_SCOPES[@]}" "${MEMORY_CONVERSATION_TAGS_READ_SCOPES[@]}" "${MEMORY_TOOL_FAVORITES_WRITE_SCOPES[@]}" "${MEMORY_TOOL_FAVORITES_READ_SCOPES[@]}" "${MEMORY_ACL_READ_SCOPES[@]}" "${MEMORY_ACL_WRITE_SCOPES[@]}"; do
      if EXISTING=$(find_scope_id "${SCOPE}"); then
        echo "  ⊝ scope ${SCOPE}: exists (${EXISTING})"
        SCOPE_ID["${SCOPE}"]="${EXISTING}"
      else
        acl_e2e_kc create client-scopes -r "${REALM}" \
          -s "name=${SCOPE}" \
          -s protocol=openid-connect \
          -s 'attributes."include.in.token.scope"=true' >/dev/null
        if NEW_ID=$(find_scope_id "${SCOPE}"); then
          echo "  ✓ scope ${SCOPE}: created (${NEW_ID})"
          SCOPE_ID["${SCOPE}"]="${NEW_ID}"
        else
          echo "❌ scope ${SCOPE}: created but id not resolvable" >&2
          exit 1
        fi
      fi
    done

    # ── Step 2: bind each scope to the right clients ──────────────
    # admin-client gets all three as DEFAULT scopes (always issued).
    # opencode + webui get them as OPTIONAL scopes (operator opts in
    # per request via the `scope=` parameter).
    declare -A CLIENT_KIND
    CLIENT_KIND["admin-client"]="default"
    CLIENT_KIND["audittrace-opencode"]="optional"
    CLIENT_KIND["audittrace-webui"]="optional"

    find_client_id() {
      local target="$1" line id
      while IFS= read -r line; do
        # kcadm with --fields id outputs one ID per line (already
        # unquoted with --noquotes). The -q query restricts the list
        # to clients matching the clientId, but kcadm still returns
        # an array — take the first non-empty line.
        id="${line//\"/}"
        if [[ -n "${id}" ]]; then
          echo "${id}"
          return 0
        fi
      done < <(acl_e2e_kc get clients -r "${REALM}" \
                 -q "clientId=${target}" \
                 --fields id --format csv --noquotes 2>/dev/null)
      return 1
    }

    bind_scope() {
      local CLIENT_ID="$1" SCOPE="$2" KIND="$3"
      local CLIENT_UUID SCOPE_UUID PATH_SUFFIX
      ACL_E2E_STAGE="bind"

      if ! CLIENT_UUID=$(find_client_id "${CLIENT_ID}"); then
        echo "  ⚠ client ${CLIENT_ID}: not found (skipped)"
        return 0
      fi
      SCOPE_UUID="${SCOPE_ID[$SCOPE]:-}"
      if [[ -z "${SCOPE_UUID}" ]]; then
        echo "❌ scope ${SCOPE}: id not resolvable — bug" >&2
        return 1
      fi

      if [[ "${KIND}" == "default" ]]; then
        PATH_SUFFIX="default-client-scopes"
      else
        PATH_SUFFIX="optional-client-scopes"
      fi

      # PUT to the binding endpoint is idempotent — Keycloak responds
      # 204 whether the binding already existed or was just created.
      #
      # Why `-b '{}'` instead of `-s ''`: kcadm 24's `update` rejects an
      # empty `-s` argument with "Invalid key=value parameter: []".
      # `-b '{}'` sends an empty JSON body, which is what the Keycloak
      # REST API actually expects on this endpoint (it's a side-effect-only
      # PUT — Keycloak ignores any body content). Discovered the hard way
      # on 2026-05-03: the script reported "✓ bound" because the kcadm
      # error was swallowed by `>/dev/null 2>&1 || true`, but the
      # binding never landed in the realm. Surface kcadm errors now.
      if ! acl_e2e_kc update \
            "clients/${CLIENT_UUID}/${PATH_SUFFIX}/${SCOPE_UUID}" \
            -r "${REALM}" -b '{}' >/dev/null 2>&1; then
        echo "  ✗ ${CLIENT_ID} ${KIND} ← ${SCOPE} (kcadm rejected the bind)" >&2
        return 1
      fi
      echo "  ✓ ${CLIENT_ID} ${KIND} ← ${SCOPE}"
    }

    for CLIENT_ID in "${!CLIENT_KIND[@]}"; do
      KIND="${CLIENT_KIND[$CLIENT_ID]}"
      echo "▶ binding scopes to client ${CLIENT_ID} (${KIND})..."
      for SCOPE in "${SCOPES[@]}"; do
        bind_scope "${CLIENT_ID}" "${SCOPE}" "${KIND}"
      done
    done

    # ── Step 2b: bind corpus scopes (operator/curator-tier only) ──
    # admin-client only, as OPTIONAL — never audittrace-opencode or
    # audittrace-webui, and never audittrace-restricted (SC-09). A
    # separate loop (not folded into CLIENT_KIND above) so a future
    # edit to CLIENT_KIND cannot silently widen corpus-scope
    # distribution to the user-facing clients (WU-A3, ADR-062 §4).
    echo "▶ binding corpus scopes to client admin-client (optional)..."
    for SCOPE in "${CORPUS_SCOPES[@]}"; do
      bind_scope "admin-client" "${SCOPE}" "optional"
    done

    # ── Step 2c: bind Souvenirs-panel memory-write scopes (M3-WU-D2-1) ──
    # audittrace-librechat only, as OPTIONAL — the browser's own login
    # token must never carry write access; only the BFF's memory-path
    # RFC 8693 exchange requests these by name. Never audittrace:admin.
    echo "▶ binding memory-proxy write scopes to client audittrace-librechat (optional)..."
    for SCOPE in "${MEMORY_CONSOLE_WRITE_SCOPES[@]}"; do
      bind_scope "audittrace-librechat" "${SCOPE}" "optional"
    done

    # ── Step 2d: bind the ephemeral-ingest scope (WU-1, 2026-09-03) ────
    # audittrace-librechat only, as OPTIONAL — separate array/loop from
    # Step 2c above (see MEMORY_SESSION_WRITE_SCOPES's comment). Only
    # WU-2's narrow upload exchange requests this scope by name.
    echo "▶ binding ephemeral-session write scope to client audittrace-librechat (optional)..."
    for SCOPE in "${MEMORY_SESSION_WRITE_SCOPES[@]}"; do
      bind_scope "audittrace-librechat" "${SCOPE}" "optional"
    done

    # ── Step 2e: bind the ephemeral-session READ-OWN scope (WU-5, 2026-09-06) ──
    # audittrace-librechat only, as DEFAULT (see MEMORY_SESSION_READ_SCOPES's
    # comment above for why this differs from Step 2d's OPTIONAL binding).
    echo "▶ binding ephemeral-session read-own scope to client audittrace-librechat (default)..."
    for SCOPE in "${MEMORY_SESSION_READ_SCOPES[@]}"; do
      bind_scope "audittrace-librechat" "${SCOPE}" "default"
    done

    # ── Step 2f: bind the console-conversations WRITE scope (Mongo-repl WU-1) ──
    # audittrace-librechat only, as OPTIONAL — separate loop, same
    # discipline as Step 2d. Only the BFF's console-conversations proxy
    # exchange requests this scope by name.
    echo "▶ binding console-conversations write scope to client audittrace-librechat (optional)..."
    for SCOPE in "${MEMORY_CONVERSATIONS_WRITE_SCOPES[@]}"; do
      bind_scope "audittrace-librechat" "${SCOPE}" "optional"
    done

    # ── Step 2g: bind the console-conversations READ-OWN scope (Mongo-repl WU-1) ──
    # audittrace-librechat only, as DEFAULT — same rationale as Step 2e.
    echo "▶ binding console-conversations read-own scope to client audittrace-librechat (default)..."
    for SCOPE in "${MEMORY_CONVERSATIONS_READ_SCOPES[@]}"; do
      bind_scope "audittrace-librechat" "${SCOPE}" "default"
    done

    # ── Step 2h: bind the console-presets WRITE scope (Mongo-repl WU-presets) ──
    # audittrace-librechat only, as OPTIONAL — separate loop, same
    # discipline as Step 2f. Only the BFF's console-presets proxy
    # exchange requests this scope by name.
    echo "▶ binding console-presets write scope to client audittrace-librechat (optional)..."
    for SCOPE in "${MEMORY_PRESETS_WRITE_SCOPES[@]}"; do
      bind_scope "audittrace-librechat" "${SCOPE}" "optional"
    done

    # ── Step 2i: bind the console-presets READ-OWN scope (Mongo-repl WU-presets) ──
    # audittrace-librechat only, as DEFAULT — same rationale as Step 2g.
    echo "▶ binding console-presets read-own scope to client audittrace-librechat (default)..."
    for SCOPE in "${MEMORY_PRESETS_READ_SCOPES[@]}"; do
      bind_scope "audittrace-librechat" "${SCOPE}" "default"
    done

    # ── Step 2j: bind the console-prompts WRITE scope (Mongo-repl WU-prompts) ──
    # audittrace-librechat only, as OPTIONAL — separate loop, same
    # discipline as Step 2h. Only the BFF's console-prompts proxy
    # exchange requests this scope by name.
    echo "▶ binding console-prompts write scope to client audittrace-librechat (optional)..."
    for SCOPE in "${MEMORY_PROMPTS_WRITE_SCOPES[@]}"; do
      bind_scope "audittrace-librechat" "${SCOPE}" "optional"
    done

    # ── Step 2k: bind the console-prompts READ-OWN scope (Mongo-repl WU-prompts) ──
    # audittrace-librechat only, as DEFAULT — same rationale as Step 2i.
    echo "▶ binding console-prompts read-own scope to client audittrace-librechat (default)..."
    for SCOPE in "${MEMORY_PROMPTS_READ_SCOPES[@]}"; do
      bind_scope "audittrace-librechat" "${SCOPE}" "default"
    done

    # ── Step 2l: bind the console-chat-projects WRITE scope (Chat-Projects domain) ──
    # audittrace-librechat only, as OPTIONAL — separate loop, same
    # discipline as Step 2j. Only the BFF's console-chat-projects proxy
    # exchange requests this scope by name.
    echo "▶ binding console-chat-projects write scope to client audittrace-librechat (optional)..."
    for SCOPE in "${MEMORY_CHAT_PROJECTS_WRITE_SCOPES[@]}"; do
      bind_scope "audittrace-librechat" "${SCOPE}" "optional"
    done

    # ── Step 2m: bind the console-chat-projects READ-OWN scope (Chat-Projects domain) ──
    # audittrace-librechat only, as DEFAULT — same rationale as Step 2k.
    echo "▶ binding console-chat-projects read-own scope to client audittrace-librechat (default)..."
    for SCOPE in "${MEMORY_CHAT_PROJECTS_READ_SCOPES[@]}"; do
      bind_scope "audittrace-librechat" "${SCOPE}" "default"
    done

    # ── Step 2n: bind the console-files WRITE scope (Files-metadata domain) ──
    # audittrace-librechat only, as OPTIONAL — separate loop, same
    # discipline as Step 2l. Only the BFF's console-files proxy
    # exchange requests this scope by name.
    echo "▶ binding console-files write scope to client audittrace-librechat (optional)..."
    for SCOPE in "${MEMORY_FILES_WRITE_SCOPES[@]}"; do
      bind_scope "audittrace-librechat" "${SCOPE}" "optional"
    done

    # ── Step 2o: bind the console-files READ-OWN scope (Files-metadata domain) ──
    # audittrace-librechat only, as DEFAULT — same rationale as Step 2m.
    echo "▶ binding console-files read-own scope to client audittrace-librechat (default)..."
    for SCOPE in "${MEMORY_FILES_READ_SCOPES[@]}"; do
      bind_scope "audittrace-librechat" "${SCOPE}" "default"
    done

    # ── Step 2p: bind the console-agents WRITE scope (Agents domain) ──
    # audittrace-librechat only, as OPTIONAL — separate loop, same
    # discipline as Step 2n. Only the BFF's console-agents proxy
    # exchange requests this scope by name.
    echo "▶ binding console-agents write scope to client audittrace-librechat (optional)..."
    for SCOPE in "${MEMORY_AGENTS_WRITE_SCOPES[@]}"; do
      bind_scope "audittrace-librechat" "${SCOPE}" "optional"
    done

    # ── Step 2q: bind the console-agents READ-OWN scope (Agents domain) ──
    # audittrace-librechat only, as DEFAULT — same rationale as Step 2o.
    echo "▶ binding console-agents read-own scope to client audittrace-librechat (default)..."
    for SCOPE in "${MEMORY_AGENTS_READ_SCOPES[@]}"; do
      bind_scope "audittrace-librechat" "${SCOPE}" "default"
    done

    # ── Step 2r: bind the console-conversation-tags WRITE scope (Conversation-Tags domain) ──
    # audittrace-librechat only, as OPTIONAL — separate loop, same
    # discipline as Step 2p. Only the BFF's console-conversation-tags
    # proxy exchange requests this scope by name.
    echo "▶ binding console-conversation-tags write scope to client audittrace-librechat (optional)..."
    for SCOPE in "${MEMORY_CONVERSATION_TAGS_WRITE_SCOPES[@]}"; do
      bind_scope "audittrace-librechat" "${SCOPE}" "optional"
    done

    # ── Step 2s: bind the console-conversation-tags READ-OWN scope (Conversation-Tags domain) ──
    # audittrace-librechat only, as DEFAULT — same rationale as Step 2q.
    echo "▶ binding console-conversation-tags read-own scope to client audittrace-librechat (default)..."
    for SCOPE in "${MEMORY_CONVERSATION_TAGS_READ_SCOPES[@]}"; do
      bind_scope "audittrace-librechat" "${SCOPE}" "default"
    done

    # ── Step 2t: bind the console-tool-favorites WRITE scope (Tool-Favorites domain) ──
    # audittrace-librechat only, as OPTIONAL — separate loop, same
    # discipline as Step 2r. Only the BFF's console-tool-favorites proxy
    # exchange requests this scope by name.
    echo "▶ binding console-tool-favorites write scope to client audittrace-librechat (optional)..."
    for SCOPE in "${MEMORY_TOOL_FAVORITES_WRITE_SCOPES[@]}"; do
      bind_scope "audittrace-librechat" "${SCOPE}" "optional"
    done

    # ── Step 2u: bind the console-tool-favorites READ-OWN scope (Tool-Favorites domain) ──
    # audittrace-librechat only, as DEFAULT — same rationale as Step 2s.
    echo "▶ binding console-tool-favorites read-own scope to client audittrace-librechat (default)..."
    for SCOPE in "${MEMORY_TOOL_FAVORITES_READ_SCOPES[@]}"; do
      bind_scope "audittrace-librechat" "${SCOPE}" "default"
    done

    # ── Step 2v: bind the console-ACL READ-OWN scope (Sovereign Authorization Layer EPIC, WU-1) ──
    # audittrace-librechat only, as DEFAULT — same rationale as Step 2u.
    echo "▶ binding console-acl read-own scope to client audittrace-librechat (default)..."
    for SCOPE in "${MEMORY_ACL_READ_SCOPES[@]}"; do
      bind_scope "audittrace-librechat" "${SCOPE}" "default"
    done

    # ── Step 2w: bind the console-ACL WRITE scope (WU-2c) ──
    # audittrace-librechat only, as OPTIONAL — like every console write scope.
    echo "▶ binding console-acl write scope to client audittrace-librechat (optional)..."
    for SCOPE in "${MEMORY_ACL_WRITE_SCOPES[@]}"; do
      bind_scope "audittrace-librechat" "${SCOPE}" "optional"
    done

    # ----- ACL WU-2c: the dedicated E2E-only device-flow client (audittrace-acl-e2e) -----
    # Flag-aware (AUDITTRACE_ACL_E2E_CLIENT_ENABLED, set by the hook Job from
    # .Values.keycloak.aclE2eClient.enabled; default true): enabled ->
    # ensure + VERIFY (fail closed on drift, never `kcadm update` a drifted
    # client); disabled -> verify-then-delete (exactly one match, clientId
    # equal) and read back an empty result. This step sits OUTSIDE the
    # MEMORY_ACL_*_SCOPES bind loops. The pinned JSON below is byte-identical
    # in scripts/setup-memory-scopes.sh and the chart ConfigMap (parity-guarded).
    ACL_E2E_CLIENT_ID="audittrace-acl-e2e"
    ACL_E2E_ENABLED="${AUDITTRACE_ACL_E2E_CLIENT_ENABLED:-true}"
    ACL_E2E_CLIENT_JSON='{"clientId":"audittrace-acl-e2e","description":"ACL WU-2c E2E-only device-flow client (sunset: WU-4 merge, keycloak.aclE2eClient.enabled=false). Holds ONLY memory:acl:read-own + memory:acl:write; no offline_access, no refresh, consent required.","enabled":true,"protocol":"openid-connect","publicClient":true,"standardFlowEnabled":false,"directAccessGrantsEnabled":false,"implicitFlowEnabled":false,"serviceAccountsEnabled":false,"consentRequired":true,"redirectUris":["urn:ietf:wg:oauth:2.0:oob"],"webOrigins":[],"attributes":{"oauth2.device.authorization.grant.enabled":"true","oauth2.device.polling.interval":"5","oauth2.device.code.lifespan":"120","use.refresh.tokens":"false","access.token.lifespan":"900"},"defaultClientScopes":["memory:acl:read-own","memory:acl:write"],"optionalClientScopes":[],"protocolMappers":[{"name":"aud-audittrace-server","protocol":"openid-connect","protocolMapper":"oidc-audience-mapper","config":{"included.custom.audience":"audittrace-server","id.token.claim":"false","access.token.claim":"true"}}]}'
    ACL_E2E_DEFAULT_SCOPES=("memory:acl:read-own" "memory:acl:write")
    ACL_E2E_STAGE="pre-step:init"

    # Whitespace-stripped JSON of one kcadm GET (so `"k" : "v"` -> `"k":"v"`).
    acl_e2e_compact() {
      local raw
      raw=$(acl_e2e_kc get "$1" -r "${REALM}") || acl_e2e_fail read-failed "cannot read the client"
      echo "${raw//[[:space:]]/}"
    }

    # Names of a client's default|optional scopes, one per line.
    acl_e2e_scope_names() {
      local out line
      out=$(acl_e2e_kc get "clients/$1/$2-client-scopes" -r "${REALM}" \
              --fields name --format csv --noquotes) \
        || acl_e2e_fail read-failed "cannot read $2 scopes"
      while IFS= read -r line; do
        line="${line//\"/}"
        [[ -n "${line}" ]] && echo "${line}"
      done <<< "${out}"
      return 0
    }

    acl_e2e_in_default_set() {
      local want
      for want in "${ACL_E2E_DEFAULT_SCOPES[@]}"; do
        [[ "$1" == "${want}" ]] && return 0
      done
      return 1
    }

    # Remove every default/optional scope NOT in the pinned set (Keycloak may
    # add realm-default scopes on create): default keeps the two ACL scopes,
    # optional keeps none.
    acl_e2e_strip_scopes() {
      local uuid="$1" kind out sid sname keep
      ACL_E2E_STAGE="strip"
      for kind in default optional; do
        out=$(acl_e2e_kc get "clients/${uuid}/${kind}-client-scopes" -r "${REALM}" \
                --fields id,name --format csv --noquotes) \
          || acl_e2e_fail strip-list-failed "cannot list ${kind} scopes"
        while IFS=, read -r sid sname; do
          sid="${sid//\"/}"; sname="${sname//\"/}"
          [[ -z "${sid}" ]] && continue
          keep=0
          if [[ "${kind}" == "default" ]] && acl_e2e_in_default_set "${sname}"; then
            keep=1
          fi
          if [[ "${keep}" -eq 0 ]]; then
            acl_e2e_kc delete "clients/${uuid}/${kind}-client-scopes/${sid}" \
              -r "${REALM}" >/dev/null \
              || acl_e2e_fail strip-delete-failed "could not strip unpinned ${kind} scope"
            echo "  ✓ ${ACL_E2E_CLIENT_ID}: stripped unpinned ${kind} scope ${sname}"
          fi
        done <<< "${out}"
      done
    }

    # VERIFY (equality on the compared keys). Flags + consentRequired exact;
    # attributes a pinned SUBSET; default/optional scopes EXACT sets; protocol
    # mappers EXACT (name set == {aud-audittrace-server}, protocolMapper and
    # config pinned). Any difference -> exit non-zero with the diff.
    acl_e2e_verify() {
      local uuid="$1" diffs="" compact item name names raw line incfg cfgblocks pmok n=0
      local unexpected_default=0 unexpected_optional=0 unexpected_mapper=0 unexpected_config=0
      ACL_E2E_STAGE="verify-client"
      compact=$(acl_e2e_compact "clients/${uuid}") \
        || acl_e2e_fail read-failed "cannot read the client"
      for item in \
          '"clientId":"audittrace-acl-e2e"' '"publicClient":true' \
          '"standardFlowEnabled":false' '"directAccessGrantsEnabled":false' \
          '"implicitFlowEnabled":false' '"serviceAccountsEnabled":false' \
          '"consentRequired":true' \
          '"oauth2.device.authorization.grant.enabled":"true"' \
          '"oauth2.device.polling.interval":"5"' \
          '"oauth2.device.code.lifespan":"120"' \
          '"use.refresh.tokens":"false"' '"access.token.lifespan":"900"'; do
        [[ "${compact}" == *"${item}"* ]] || diffs+=" missing:${item}"
      done
      # default scopes: exact set (read FIRST, so a failed read is fatal and
      # can never look like an empty/equal set)
      ACL_E2E_STAGE="verify-default-scopes"
      names=$(acl_e2e_scope_names "${uuid}" default) \
        || acl_e2e_fail read-failed "cannot read default scopes"
      n=0
      unexpected_default=0
      while IFS= read -r name; do
        [[ -z "${name}" ]] && continue
        n=$((n + 1))
        acl_e2e_in_default_set "${name}" || unexpected_default=$((unexpected_default + 1))
      done <<< "${names}"
      # F4 §5 / R4: detail= is a CLOSED VOCABULARY built from PROPERTIES
      # (counts, shapes) — NEVER a byte of the response itself. A deny-list
      # mask on specific secret SHAPES (the prior round's fix) is beatable by
      # any shape it doesn't name; omitting response-derived text entirely is
      # the only fail-closed form.
      [[ "${unexpected_default}" -eq 0 ]] \
        || diffs+=" unexpected-default-scope:count=${unexpected_default}"
      [[ "${n}" -eq "${#ACL_E2E_DEFAULT_SCOPES[@]}" ]] \
        || diffs+=" default-scope-count:${n}"
      # optional scopes: exact empty set
      ACL_E2E_STAGE="verify-optional-scopes"
      names=$(acl_e2e_scope_names "${uuid}" optional) \
        || acl_e2e_fail read-failed "cannot read optional scopes"
      unexpected_optional=0
      while IFS= read -r name; do
        [[ -z "${name}" ]] && continue
        unexpected_optional=$((unexpected_optional + 1))
      done <<< "${names}"
      [[ "${unexpected_optional}" -eq 0 ]] \
        || diffs+=" unexpected-optional-scope:count=${unexpected_optional}"
      # protocol mappers: exact name set + pinned protocolMapper/config
      ACL_E2E_STAGE="verify-mappers"
      names=$(acl_e2e_kc get "clients/${uuid}/protocol-mappers/models" -r "${REALM}" \
                --fields name --format csv --noquotes) \
        || acl_e2e_fail read-failed "cannot read protocol mappers"
      n=0
      unexpected_mapper=0
      while IFS= read -r name; do
        name="${name//\"/}"
        [[ -z "${name}" ]] && continue
        n=$((n + 1))
        [[ "${name}" == "aud-audittrace-server" ]] || unexpected_mapper=$((unexpected_mapper + 1))
      done <<< "${names}"
      [[ "${unexpected_mapper}" -eq 0 ]] \
        || diffs+=" unexpected-mapper:count=${unexpected_mapper}"
      [[ "${n}" -eq 1 ]] || diffs+=" mapper-count:${n}"
      ACL_E2E_STAGE="verify-mapper-config"
      raw=$(acl_e2e_kc get "clients/${uuid}/protocol-mappers/models" -r "${REALM}") \
        || acl_e2e_fail read-failed "cannot read the mapper config"
      # SC-1, EXACT: the mapper's name and protocolMapper equal the pinned
      # values and its `config` map holds EXACTLY the pinned three pairs - no
      # extra key (an audience widening or a hardcoded-claim `scope` writer
      # would be one), none missing. Lines are compared VERBATIM: only the
      # indentation, a trailing comma and the `" : "` key separator of kcadm's
      # pretty-printed JSON are normalised, so whitespace INSIDE a value (for
      # example `audittrace -server`) is a difference. This relies on kcadm's
      # one-key-per-line pretty output of a ProtocolMapperRepresentation (id,
      # name, protocol, protocolMapper, consentRequired, config - `config` is
      # a flat string map with unique keys); a compact or re-shaped output
      # finds no `config` block and fails closed (mapper-config-absent). No
      # allow-list: if a real Keycloak adds a config key on create, this fails
      # closed and the spec is amended.
      incfg=0
      cfgblocks=0
      pmok=0
      n=0
      while IFS= read -r line; do
        line="${line#"${line%%[![:space:]]*}"}"
        line="${line%"${line##*[![:space:]]}"}"
        line="${line%,}"
        line="${line/ : /:}"
        if [[ "${incfg}" -eq 1 ]]; then
          if [[ "${line}" == "}" ]]; then
            incfg=0
            continue
          fi
          n=$((n + 1))
          case "${line}" in
            '"included.custom.audience":"audittrace-server"' | '"id.token.claim":"false"' | '"access.token.claim":"true"') ;;
            *) unexpected_config=$((unexpected_config + 1)) ;;
          esac
        elif [[ "${line}" == '"config":{' ]]; then
          incfg=1
          cfgblocks=$((cfgblocks + 1))
        elif [[ "${line}" == '"protocolMapper":"oidc-audience-mapper"' ]]; then
          pmok=1
        fi
      done <<< "${raw}"
      [[ "${unexpected_config}" -eq 0 ]] \
        || diffs+=" unexpected-mapper-config:count=${unexpected_config}"
      [[ "${pmok}" -eq 1 ]] || diffs+=" missing-mapper-field:protocolMapper"
      if [[ "${cfgblocks}" -ne 1 ]]; then
        diffs+=" mapper-config-absent"
      else
        [[ "${n}" -eq 3 ]] || diffs+=" mapper-config-count:${n}"
      fi
      if [[ -n "${diffs}" ]]; then
        acl_e2e_fail drift "drift from the pinned client (fail closed, no kcadm update):${diffs}"
      fi
      echo "  ✓ ${ACL_E2E_CLIENT_ID}: verified equal to the pinned block"
    }

    # Matching clients as csv `id,clientId` lines; query failure is fatal.
    # Read-only shape capture (F §3 / F1 §5 / F2 §5 / F3 S2-6): default off
    # (AUDITTRACE_ACL_E2E_SHAPE_CAPTURE); prints key names with VALUES typed
    # and redacted — never a value — between `acl-e2e: shape-begin <what>` /
    # `acl-e2e: shape-end` markers; issues GETs only, changes no control
    # flow. Pure bash (the image has no jq/awk/curl). Any line not matching
    # an allowlisted shape is `<line:redacted len=n>` (fail closed) — a
    # public client's representation may carry `registrationAccessToken`,
    # and the rule must not depend on where it sits.
    acl_e2e_shape_line() {
      local line="$1" trimmed key rest trail=""
      trimmed="${line#"${line%%[![:space:]]*}"}"
      trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
      case "${trimmed}" in
        '{' | '[' | '},' | '],' | '}' | ']')
          printf '%s\n' "${trimmed}"
          return
          ;;
      esac
      if [[ "${trimmed}" == *, ]]; then
        trail=","
        trimmed="${trimmed%,}"
      fi
      if [[ "${trimmed}" =~ ^\"([^\"]*)\"\ :\ (.*)$ ]]; then
        key="\"${BASH_REMATCH[1]}\""
        rest="${BASH_REMATCH[2]}"
        if [[ "${rest}" =~ ^\"(.*)\"$ ]]; then
          printf '%s: <string:%d>%s\n' "${key}" "${#rest}" "${trail}"
        elif [[ "${rest}" == "true" || "${rest}" == "false" ]]; then
          printf '%s: <bool>%s\n' "${key}" "${trail}"
        elif [[ "${rest}" == "null" ]]; then
          printf '%s: <null>%s\n' "${key}" "${trail}"
        elif [[ "${rest}" == "{" || "${rest}" == "{}" ]]; then
          printf '%s: %s%s\n' "${key}" "${rest}" "${trail}"
        elif [[ "${rest}" == "[" || "${rest}" == "[]" ]]; then
          printf '%s: %s%s\n' "${key}" "${rest}" "${trail}"
        elif [[ "${rest}" =~ ^\[(.*)\]$ ]]; then
          local inner="${BASH_REMATCH[1]}" count=0 i
          if [[ -n "${inner//[[:space:]]/}" ]]; then
            count=1
            for ((i = 0; i < ${#inner}; i++)); do
              [[ "${inner:i:1}" == "," ]] && count=$((count + 1))
            done
          fi
          printf '%s: <array:%d>%s\n' "${key}" "${count}" "${trail}"
        elif [[ "${rest}" =~ ^[0-9]+$ ]]; then
          printf '%s: <number>%s\n' "${key}" "${trail}"
        else
          printf '<line:redacted len=%d>\n' "${#line}"
        fi
        return
      fi
      if [[ "${trimmed}" =~ ^\"(.*)\"$ ]]; then
        printf '<string:%d>%s\n' "${#trimmed}" "${trail}"
        return
      fi
      printf '<line:redacted len=%d>\n' "${#line}"
    }

    acl_e2e_shape_capture() {
      local what="$1" uuid="$2" raw line
      [[ "${AUDITTRACE_ACL_E2E_SHAPE_CAPTURE:-0}" == "1" ]] || return 0
      echo "acl-e2e: shape-begin ${what}"
      for path in "clients/${uuid}" "clients/${uuid}/default-client-scopes" \
                  "clients/${uuid}/optional-client-scopes" \
                  "clients/${uuid}/protocol-mappers/models"; do
        raw=$(acl_e2e_kc get "${path}" -r "${REALM}") || continue
        while IFS= read -r line; do
          acl_e2e_shape_line "${line}"
        done <<< "${raw}"
      done
      echo "acl-e2e: shape-end"
    }

    acl_e2e_lookup() {
      local out
      out=$(acl_e2e_kc get clients -r "${REALM}" -q "clientId=${ACL_E2E_CLIENT_ID}" \
              --fields id,clientId --format csv --noquotes) \
        || acl_e2e_fail lookup-failed "client lookup failed"
      echo "${out//\"/}"
    }

    if [[ "${ACL_E2E_ENABLED}" == "true" ]]; then
      echo "▶ ensuring the dedicated E2E client ${ACL_E2E_CLIENT_ID} (enabled)..."
      ACL_E2E_STAGE="lookup"
      ACL_E2E_FOUND=$(acl_e2e_lookup) || acl_e2e_fail lookup-failed "client lookup failed"
      if [[ -z "${ACL_E2E_FOUND//[[:space:]]/}" ]]; then
        ACL_E2E_STAGE="create"
        printf '%s' "${ACL_E2E_CLIENT_JSON}" | acl_e2e_kc create clients -r "${REALM}" -f - >/dev/null \
          || acl_e2e_fail create-failed "create failed"
        echo "  ✓ ${ACL_E2E_CLIENT_ID}: created"
        ACL_E2E_STAGE="lookup"
        ACL_E2E_UUID=$(acl_e2e_lookup) || acl_e2e_fail lookup-failed "client lookup failed"
        ACL_E2E_UUID="${ACL_E2E_UUID%%,*}"
        [[ -n "${ACL_E2E_UUID}" ]] || acl_e2e_fail id-unresolvable "created but id not resolvable"
        acl_e2e_strip_scopes "${ACL_E2E_UUID}"
        ACL_E2E_STAGE="bind"
        for SCOPE in "${ACL_E2E_DEFAULT_SCOPES[@]}"; do
          bind_scope "${ACL_E2E_CLIENT_ID}" "${SCOPE}" "default"
        done
        acl_e2e_shape_capture after-create "${ACL_E2E_UUID}"
      else
        [[ "$(echo "${ACL_E2E_FOUND}" | grep -c .)" -eq 1 ]] \
          || acl_e2e_fail ambiguous-match "more than one client matches (refusing)"
        ACL_E2E_UUID="${ACL_E2E_FOUND%%,*}"
        acl_e2e_shape_capture after-lookup "${ACL_E2E_UUID}"
      fi
      acl_e2e_verify "${ACL_E2E_UUID}"
    else
      echo "▶ removing the dedicated E2E client ${ACL_E2E_CLIENT_ID} (disabled — sunset)..."
      ACL_E2E_STAGE="sunset-lookup"
      ACL_E2E_FOUND=$(acl_e2e_lookup) || acl_e2e_fail lookup-failed "client lookup failed"
      if [[ -z "${ACL_E2E_FOUND//[[:space:]]/}" ]]; then
        echo "  ⊝ ${ACL_E2E_CLIENT_ID}: absent (empty query result)"
      else
        [[ "$(echo "${ACL_E2E_FOUND}" | grep -c .)" -eq 1 ]] \
          || acl_e2e_fail ambiguous-match "refusing to delete: query did not return exactly one client"
        [[ "${ACL_E2E_FOUND#*,}" == "${ACL_E2E_CLIENT_ID}" ]] \
          || acl_e2e_fail sunset-wrong-client-id "refusing to delete: returned clientId is not ${ACL_E2E_CLIENT_ID}"
        acl_e2e_shape_capture after-lookup "${ACL_E2E_FOUND%%,*}"
        ACL_E2E_STAGE="sunset-delete"
        acl_e2e_kc delete "clients/${ACL_E2E_FOUND%%,*}" -r "${REALM}" >/dev/null \
          || acl_e2e_fail sunset-delete-failed "delete failed"
        ACL_E2E_STAGE="sunset-readback"
        ACL_E2E_FOUND=$(acl_e2e_lookup) || acl_e2e_fail lookup-failed "read-back lookup failed"
        [[ -z "${ACL_E2E_FOUND//[[:space:]]/}" ]] \
          || acl_e2e_fail sunset-readback-nonempty "read-back after delete is not empty"
        echo "  ✓ ${ACL_E2E_CLIENT_ID}: deleted (read-back empty)"
      fi
    fi

    # ── Step 3: ensure user-identity protocol mappers ─────────────
    #
    # Without these mappers on user-facing clients, JWTs carry only a
    # bare UUID `sub` and no `preferred_username` / `email` / `name`
    # claims — every audit/log entry shows the UUID with no human
    # identifier. Found in PR A's 2026-05-03 live test: smoke JWT had
    # `preferred_username: None`.
    #
    # Why direct protocol mappers instead of the standard `profile`
    # scope: Keycloak's `--import-realm` honours the realm.json's
    # explicit `clientScopes` list and does NOT auto-create the
    # built-in `profile` / `email` scopes when they're absent from the
    # imported list. Adding them would mean either creating the scopes
    # ourselves (with their full mapper bundle) or pulling in Keycloak's
    # default scopes — both larger lifts. Direct client-level mappers
    # are the surgical fix and what realm.json now declares for fresh
    # installs.
    #
    # admin-client doesn't need these — service accounts have no human
    # identity to surface.
    ensure_mapper() {
      local CLIENT_ID="$1" MAPPER_NAME="$2" USER_ATTR="$3" CLAIM_NAME="$4"
      local CLIENT_UUID
      ACL_E2E_STAGE="mapper-ensure"
      if ! CLIENT_UUID=$(find_client_id "${CLIENT_ID}"); then
        echo "  ⚠ client ${CLIENT_ID}: not found (skipped)"
        return 0
      fi
      # Idempotency: list existing mappers, skip if name already present.
      local existing
      existing=$(acl_e2e_kc get \
                   "clients/${CLIENT_UUID}/protocol-mappers/models" \
                   -r "${REALM}" --fields name --format csv --noquotes \
                   2>/dev/null | grep -Fx "${MAPPER_NAME}" || true)
      if [[ -n "${existing}" ]]; then
        echo "  ⊝ ${CLIENT_ID} mapper ${MAPPER_NAME}: exists"
        return 0
      fi
      # Create the mapper. `oidc-usermodel-property-mapper` reads
      # built-in user properties (username, email, firstName, lastName)
      # and stamps them as the named claim on the access + id token.
      #
      # Why printf-into-pipe instead of a heredoc: this script lives
      # inside a YAML block-scalar in a ConfigMap manifest. Bash
      # heredocs with `<<EOF` require their body to start at column 0,
      # which conflicts with YAML's mandatory consistent indentation.
      # Building the JSON via a single-line printf sidesteps the
      # indentation conflict cleanly.
      local body
      body=$(printf '{"name":"%s","protocol":"openid-connect","protocolMapper":"oidc-usermodel-property-mapper","config":{"user.attribute":"%s","claim.name":"%s","jsonType.label":"String","id.token.claim":"true","access.token.claim":"true","userinfo.token.claim":"true"}}' \
        "${MAPPER_NAME}" "${USER_ATTR}" "${CLAIM_NAME}")
      printf '%s' "${body}" | acl_e2e_kc create \
        "clients/${CLIENT_UUID}/protocol-mappers/models" \
        -r "${REALM}" -f - >/dev/null
      echo "  ✓ ${CLIENT_ID} mapper ${MAPPER_NAME}: created"
    }

    for CLIENT_ID in audittrace-opencode audittrace-webui; do
      echo "▶ ensuring user-identity mappers on ${CLIENT_ID}..."
      ensure_mapper "${CLIENT_ID}" preferred-username username preferred_username
      ensure_mapper "${CLIENT_ID}" email email email
      ensure_mapper "${CLIENT_ID}" given-name firstName given_name
      ensure_mapper "${CLIENT_ID}" family-name lastName family_name
    done

    # ── Step 4: authorize the BFF's RFC 8693 token-exchange (M3-WU-2b) ──
    #
    # Grants ONLY `audittrace-librechat-bff`'s service account permission
    # to exchange a caller's own token for one minted by
    # `audittrace-librechat` — that TARGET client's own protocol mapper +
    # default-scope grant is what actually stamps aud=audittrace-server +
    # scope=audittrace:query on the result (see bff/exchange.py and the
    # `token-exchange.authorized-source-client` attribute declared on
    # `audittrace-librechat` in realm-audittrace.json — the two are kept
    # in lock-step by
    # tests/test_chart_drift_guards.py::TestKeycloakTokenExchangePermission).
    #
    # Same "realm.json only imports on FIRST run" gap Steps 1-3 above
    # exist to close: KC 24's internal client-to-client exchange
    # authorization is a fine-grained ADMIN permission living under the
    # built-in `realm-management` resource server, which `--import-realm`
    # cannot express as a plain client-scope grant. Three idempotent
    # kcadm calls, each individually safe to re-run on every helm
    # upgrade:
    #   1. Enable "management permissions" on the TARGET client — this
    #      auto-creates a `token-exchange` scope-permission (Keycloak
    #      returns the SAME resource/permission ids on every call).
    #   2. Create (find-or-create) a Client authorization policy naming
    #      the SOURCE client's service account.
    #   3. Attach that policy to the token-exchange permission.
    #
    # Verified live against a throwaway Keycloak 24.0.5 container
    # (2026-08-29) using these exact client names: BEFORE this wiring the
    # exchange grant returns `access_denied: Client not allowed to
    # exchange`; AFTER, it mints a token carrying the caller's own `sub`,
    # `aud` including `audittrace-server`, and `scope` including
    # `audittrace:query` — and a scope NOT granted to
    # `audittrace-librechat` (e.g. a write scope) is silently dropped
    # from the minted token, never granted (D3's "beyond audittrace:query
    # is refused" — the target client's own scope profile is the
    # boundary, not something the exchange `scope=` parameter can
    # widen). An unauthenticated exchange (missing/invalid
    # client_secret) fails closed with `unauthorized_client` — a
    # Keycloak OAuth-client-auth guarantee this script does not itself
    # configure.
    TOKEN_EXCHANGE_TARGET_CLIENT="audittrace-librechat"
    TOKEN_EXCHANGE_SOURCE_CLIENT="audittrace-librechat-bff"
    TOKEN_EXCHANGE_POLICY_NAME="allow-${TOKEN_EXCHANGE_SOURCE_CLIENT}-token-exchange"

    find_policy_id() {
      local target="$1" client_uuid="$2" id name
      while IFS=, read -r id name; do
        if [[ "${name}" == "${target}" ]]; then
          echo "${id}"
          return 0
        fi
      done < <(acl_e2e_kc get "clients/${client_uuid}/authz/resource-server/policy" \
                 -r "${REALM}" --fields id,name --format csv --noquotes 2>/dev/null)
      return 1
    }

    echo "▶ authorizing ${TOKEN_EXCHANGE_SOURCE_CLIENT} to exchange for ${TOKEN_EXCHANGE_TARGET_CLIENT}..."
    ACL_E2E_STAGE="token-exchange"

    if ! TARGET_UUID=$(find_client_id "${TOKEN_EXCHANGE_TARGET_CLIENT}"); then
      echo "❌ target client ${TOKEN_EXCHANGE_TARGET_CLIENT} not found — cannot authorize exchange." >&2
      exit 1
    fi
    if ! SOURCE_UUID=$(find_client_id "${TOKEN_EXCHANGE_SOURCE_CLIENT}"); then
      echo "❌ source client ${TOKEN_EXCHANGE_SOURCE_CLIENT} not found — cannot authorize exchange." >&2
      exit 1
    fi
    if ! REALM_MGMT_UUID=$(find_client_id "realm-management"); then
      echo "❌ built-in realm-management client not found — cannot authorize exchange." >&2
      exit 1
    fi

    acl_e2e_kc update "clients/${TARGET_UUID}/management/permissions" \
      -r "${REALM}" -s enabled=true >/dev/null
    TOKEN_EXCHANGE_PERM_ID=$(acl_e2e_kc get "clients/${TARGET_UUID}/management/permissions" -r "${REALM}" \
      | grep '"token-exchange"' | sed -E 's/.*"token-exchange" *: *"([^"]+)".*/\1/')
    if [[ -z "${TOKEN_EXCHANGE_PERM_ID}" ]]; then
      echo "❌ could not resolve the token-exchange scope-permission id for ${TOKEN_EXCHANGE_TARGET_CLIENT}." >&2
      exit 1
    fi
    echo "  ✓ token-exchange permission id: ${TOKEN_EXCHANGE_PERM_ID}"

    if EXISTING_POLICY_ID=$(find_policy_id "${TOKEN_EXCHANGE_POLICY_NAME}" "${REALM_MGMT_UUID}"); then
      echo "  ⊝ policy ${TOKEN_EXCHANGE_POLICY_NAME}: exists (${EXISTING_POLICY_ID})"
      TOKEN_EXCHANGE_POLICY_ID="${EXISTING_POLICY_ID}"
    else
      acl_e2e_kc create "clients/${REALM_MGMT_UUID}/authz/resource-server/policy/client" \
        -r "${REALM}" \
        -s "name=${TOKEN_EXCHANGE_POLICY_NAME}" \
        -s "clients=[\"${SOURCE_UUID}\"]" >/dev/null
      if NEW_POLICY_ID=$(find_policy_id "${TOKEN_EXCHANGE_POLICY_NAME}" "${REALM_MGMT_UUID}"); then
        echo "  ✓ policy ${TOKEN_EXCHANGE_POLICY_NAME}: created (${NEW_POLICY_ID})"
        TOKEN_EXCHANGE_POLICY_ID="${NEW_POLICY_ID}"
      else
        echo "❌ policy ${TOKEN_EXCHANGE_POLICY_NAME}: created but id not resolvable" >&2
        exit 1
      fi
    fi

    acl_e2e_kc update "clients/${REALM_MGMT_UUID}/authz/resource-server/permission/scope/${TOKEN_EXCHANGE_PERM_ID}" \
      -r "${REALM}" -s "policies=[\"${TOKEN_EXCHANGE_POLICY_ID}\"]" >/dev/null
    echo "  ✓ ${TOKEN_EXCHANGE_SOURCE_CLIENT} authorized to exchange for ${TOKEN_EXCHANGE_TARGET_CLIENT}"

    echo "✅ memory-scopes provisioning complete."

    # ── Step 5: reconcile profile/email/offline_access (M3-WU-3b, D3) ──
    #
    # realm-audittrace.json now declares these three standard OIDC
    # scopes (fresh installs get them for free via --import-realm), but
    # this Job also runs on every helm upgrade against a PRE-EXISTING
    # realm — the same "--import-realm only imports on FIRST run" gap
    # Steps 1-4 above exist to close. Without this step, an already-
    # running realm (e.g. one deployed before this chart version) would
    # be missing profile/email/offline_access on audittrace-librechat
    # forever, and LibreChat's OPENID_SCOPE="openid profile email
    # offline_access" (D2) would silently drop the unrecognized scopes
    # from every token — LibreChat's session still logs in (openid is
    # always granted), but no refresh token, no email/given_name/
    # family_name claims.
    #
    # Bodies mirror the protocolMappers declared in realm-audittrace.json
    # exactly (kept in lock-step by
    # tests/test_chart_drift_guards.py::TestConsoleRealmScopeReconcile).
    ACL_E2E_STAGE="scope-reconcile"
    echo "▶ reconciling profile/email/offline_access client scopes..."

    ensure_client_scope_with_body() {
      local NAME="$1" BODY="$2"
      if EXISTING=$(find_scope_id "${NAME}"); then
        echo "  ⊝ scope ${NAME}: exists (${EXISTING})"
        SCOPE_ID["${NAME}"]="${EXISTING}"
      else
        printf '%s' "${BODY}" | acl_e2e_kc create client-scopes -r "${REALM}" -f - >/dev/null
        if NEW_ID=$(find_scope_id "${NAME}"); then
          echo "  ✓ scope ${NAME}: created (${NEW_ID})"
          SCOPE_ID["${NAME}"]="${NEW_ID}"
        else
          echo "❌ scope ${NAME}: created but id not resolvable" >&2
          exit 1
        fi
      fi
    }

    PROFILE_BODY='{"name":"profile","protocol":"openid-connect","attributes":{"include.in.token.scope":"true","display.on.consent.screen":"true"},"protocolMappers":[{"name":"username","protocol":"openid-connect","protocolMapper":"oidc-usermodel-property-mapper","config":{"user.attribute":"username","claim.name":"preferred_username","jsonType.label":"String","id.token.claim":"true","access.token.claim":"true","userinfo.token.claim":"true"}},{"name":"given name","protocol":"openid-connect","protocolMapper":"oidc-usermodel-property-mapper","config":{"user.attribute":"firstName","claim.name":"given_name","jsonType.label":"String","id.token.claim":"true","access.token.claim":"true","userinfo.token.claim":"true"}},{"name":"family name","protocol":"openid-connect","protocolMapper":"oidc-usermodel-property-mapper","config":{"user.attribute":"lastName","claim.name":"family_name","jsonType.label":"String","id.token.claim":"true","access.token.claim":"true","userinfo.token.claim":"true"}}]}'
    EMAIL_BODY='{"name":"email","protocol":"openid-connect","attributes":{"include.in.token.scope":"true","display.on.consent.screen":"true"},"protocolMappers":[{"name":"email","protocol":"openid-connect","protocolMapper":"oidc-usermodel-property-mapper","config":{"user.attribute":"email","claim.name":"email","jsonType.label":"String","id.token.claim":"true","access.token.claim":"true","userinfo.token.claim":"true"}},{"name":"email verified","protocol":"openid-connect","protocolMapper":"oidc-usermodel-property-mapper","config":{"user.attribute":"emailVerified","claim.name":"email_verified","jsonType.label":"boolean","id.token.claim":"true","access.token.claim":"true","userinfo.token.claim":"true"}}]}'
    OFFLINE_ACCESS_BODY='{"name":"offline_access","protocol":"openid-connect","attributes":{"display.on.consent.screen":"true"}}'

    ensure_client_scope_with_body "profile" "${PROFILE_BODY}"
    ensure_client_scope_with_body "email" "${EMAIL_BODY}"
    ensure_client_scope_with_body "offline_access" "${OFFLINE_ACCESS_BODY}"

    echo "▶ binding profile/email/offline_access to audittrace-librechat..."
    bind_scope "audittrace-librechat" "profile" "default"
    bind_scope "audittrace-librechat" "email" "default"
    bind_scope "audittrace-librechat" "offline_access" "optional"

    echo "✅ console realm-scope reconcile complete."

    # ── Step 6: reconcile audittrace-librechat redirectUris/webOrigins ──
    # (M3-WU-D2-5D, 2026-09-01)
    #
    # Root cause this closes: on 2026-08-31 login failed until an operator
    # hand-added `https://librechat.audittrace.local/oauth/openid/callback`
    # to `audittrace-librechat` in the Keycloak admin console — realm.json
    # already declared the correct redirectUris/webOrigins, but
    # `kc.sh start --import-realm` NEVER overwrites an existing realm, so a
    # change to those two fields after first import silently never reaches
    # the running DB. Same "config-as-code that never reconciles to the
    # running system" disease Steps 1-5 above exist to close for scopes/
    # mappers/token-exchange — this step closes it for the client's own
    # redirect fields.
    #
    # Deliberately driven by `console.librechat.host` — the SAME chart
    # value `templates/console/deployment-librechat.yaml` uses to render
    # DOMAIN_CLIENT/DOMAIN_SERVER (the D5 lock-step that template's own
    # comment documents) — never by `keycloak.librechat.redirectUris`
    # (the values.yaml literal realm.json's FIRST-import path renders
    # from). Keying the reconcile to the host value the running LibreChat
    # pod actually serves from is what makes it self-correcting even when
    # an operator bumps `console.librechat.host` and forgets the sibling
    # `keycloak.librechat.redirectUris`/`webOrigins` literals.
    #
    # SETS (never appends/merges) both fields to exactly one entry each —
    # the failure mode above was a STALE wrong entry that needed
    # replacing, not a missing one that needed adding alongside it.
    # Exact-match only, HTTPS only, no wildcard `*`/`/*` suffix (RFC 9700
    # — ties the OIDC-REDIRECT-URI-DRIFT security item and
    # `feedback_no_more_drifts`).
    #
    # Scoped to this ONE client's TWO fields only — every other client,
    # user, mapper, and scope on the realm (including this same client's
    # own scope grants, reconciled separately by Steps 2c/5 above) is
    # untouched by this step. Falsifiability covered by
    # tests/test_chart_drift_guards.py::TestD25DConsoleRedirectReconcile
    # (renders this Job's ConfigMap, targets this exact step block).
    CONSOLE_REDIRECT_URI="https://{{ .Values.console.librechat.host }}/oauth/openid/callback"
    CONSOLE_WEB_ORIGIN="https://{{ .Values.console.librechat.host }}"

    ACL_E2E_STAGE="redirect-reconcile"
    echo "▶ reconciling audittrace-librechat redirectUris/webOrigins..."
    if ! LIBRECHAT_CLIENT_UUID=$(find_client_id "audittrace-librechat"); then
      echo "❌ client audittrace-librechat not found — cannot reconcile redirect URIs." >&2
      exit 1
    fi
    acl_e2e_kc update "clients/${LIBRECHAT_CLIENT_UUID}" -r "${REALM}" \
      -s "redirectUris=[\"${CONSOLE_REDIRECT_URI}\"]" \
      -s "webOrigins=[\"${CONSOLE_WEB_ORIGIN}\"]" >/dev/null
    echo "  ✓ audittrace-librechat redirectUris=[\"${CONSOLE_REDIRECT_URI}\"] webOrigins=[\"${CONSOLE_WEB_ORIGIN}\"]"
    echo "✅ audittrace-librechat redirect reconcile complete."

    # ── Istio sidecar shutdown ────────────────────────────────────
    # Same intent as the summariser-role Job (Phase C.8 root cause):
    # without telling Envoy to quit, istio-proxy keeps the Pod 2/3
    # NotReady forever and the helm post-upgrade hook reports
    # `failed: context deadline exceeded`.
    #
    # The Keycloak image has no curl/wget. We use bash's built-in
    # /dev/tcp socket to issue a one-shot HTTP/1.0 POST against the
    # local Envoy admin endpoint. Idempotent — if the sidecar already
    # quit, the connection refused and we move on.
    {{- if .Values.istio.enabled }}
    # Wrap in a subshell + `set +e` so any fd-close glitch can't fail
    # the whole script (`set -euo pipefail` at the top would otherwise
    # propagate). The provisioning above is already complete; this
    # block is a Pod-cleanup convenience, not a correctness step.
    (
      set +e
      if (exec 4<>/dev/tcp/127.0.0.1/15020) 2>/dev/null; then
        printf 'POST /quitquitquit HTTP/1.0\r\nHost: 127.0.0.1\r\nContent-Length: 0\r\n\r\n' >&4
        cat <&4 >/dev/null 2>&1
        exec 4<&-
        echo "istio quitquitquit: sent"
      else
        echo "istio quitquitquit: socket open failed (sidecar may already be gone)"
      fi
    ) || true
    {{- end }}
    echo "Job completing."
{{- end }}
