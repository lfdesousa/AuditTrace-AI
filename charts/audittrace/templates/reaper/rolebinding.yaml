{{- if .Values.reaper.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-pod-reaper
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "audittrace.labels" . | nindent 4 }}
    app.kubernetes.io/component: pod-reaper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-pod-reaper
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-pod-reaper
    namespace: {{ .Release.Namespace }}
{{- end }}
