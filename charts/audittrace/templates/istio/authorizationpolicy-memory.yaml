{{- if .Values.istio.enabled }}
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ .Release.Name }}-allow-memory
  labels:
    {{- include "audittrace.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: memory-server
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
              {{- if .Values.console.enabled }}
              # M3-WU-3b (D1) — the LibreChat BFF proxies /v1/chat/completions
              # to the in-cluster memory-server Service directly (in-mesh,
              # never via the external front door).
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/{{ .Values.console.bff.serviceAccount.name }}"
              {{- end }}
      to:
        - operation:
            ports: ["{{ .Values.memoryServer.port }}"]
            {{- if .Values.console.enabled }}
            # BFF-CHAT-ROUTE-ERRORS ADDENDUM-2: the refused-turn record has no
            # JWT of its writer. The gateway (and so every outside caller) is
            # kept off its path here; the rule below admits the BFF alone.
            notPaths: ["/interactions/refusals"]
            {{- end }}
    {{- if .Values.console.enabled }}
    - from:
        - source:
            principals:
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/{{ .Values.console.bff.serviceAccount.name }}"
      to:
        - operation:
            ports: ["{{ .Values.memoryServer.port }}"]
            methods: ["POST"]
            paths: ["/interactions/refusals"]
    {{- end }}
{{- end }}
