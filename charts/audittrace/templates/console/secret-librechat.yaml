{{- /* M3-WU-3b — LibreChat's own session/credential-encryption material
       (creds/JWT/OIDC-session secrets, all Mongo-side, LibreChat-internal —
       not part of the AuditTrace audit trail). No Vault wiring per spec D4
       (only the BFF's exchange secret is in scope); operator supplies real
       values via secrets.console.* before console.enabled=true goes live.
       Rendered regardless of vault.enabled — these have no Vault-Agent
       counterpart to source from. */ -}}
{{- if .Values.console.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-librechat-secret
  labels:
    {{- include "audittrace.labels" . | nindent 4 }}
type: Opaque
stringData:
  creds-key: {{ .Values.secrets.console.credsKey | quote }}
  creds-iv: {{ .Values.secrets.console.credsIv | quote }}
  jwt-secret: {{ .Values.secrets.console.jwtSecret | quote }}
  jwt-refresh-secret: {{ .Values.secrets.console.jwtRefreshSecret | quote }}
  openid-session-secret: {{ .Values.secrets.console.openidSessionSecret | quote }}
{{- end }}
