{{- /* M3-WU-3b — LibreChat's own session/credential-encryption material
       (creds/JWT/OIDC-session secrets, all Mongo-side, LibreChat-internal —
       not part of the AuditTrace audit trail). No Vault wiring per spec D4
       (only the BFF's exchange secret is in scope). Rendered regardless of
       vault.enabled — these have no Vault-Agent counterpart to source from.

       M3-WU-3c (D3) — generate-if-absent + persist. Regenerating these on
       every `helm upgrade` silently invalidates every active session and
       any already-encrypted stored credential, so each field is computed
       via audittrace.console.persistedSecret (see _helpers.tpl): an
       explicit secrets.console.<field> value wins if set; otherwise the
       value already in the cluster (found via a `lookup`-guarded read,
       which only sees anything against a REAL cluster — `helm template`/
       `helm lint` always see an empty lookup and fall through) is reused;
       only a genuinely first install generates a fresh value. No `openssl`
       in the operator's hands. */ -}}
{{- if .Values.console.enabled }}
{{- $secretName := printf "%s-librechat-secret" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $existingData := dict }}
{{- if $existing }}
{{- $existingData = $existing.data | default dict }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "audittrace.labels" . | nindent 4 }}
type: Opaque
data:
  creds-key: {{ include "audittrace.console.persistedSecret" (dict "explicit" .Values.secrets.console.credsKey "existing" $existingData "key" "creds-key" "kind" "hex64") }}
  creds-iv: {{ include "audittrace.console.persistedSecret" (dict "explicit" .Values.secrets.console.credsIv "existing" $existingData "key" "creds-iv" "kind" "hex32") }}
  jwt-secret: {{ include "audittrace.console.persistedSecret" (dict "explicit" .Values.secrets.console.jwtSecret "existing" $existingData "key" "jwt-secret" "kind" "alnum") }}
  jwt-refresh-secret: {{ include "audittrace.console.persistedSecret" (dict "explicit" .Values.secrets.console.jwtRefreshSecret "existing" $existingData "key" "jwt-refresh-secret" "kind" "alnum") }}
  openid-session-secret: {{ include "audittrace.console.persistedSecret" (dict "explicit" .Values.secrets.console.openidSessionSecret "existing" $existingData "key" "openid-session-secret" "kind" "alnum") }}
{{- end }}
