{{- if and .Values.istio.enabled .Values.console.enabled }}
# M3-WU-3b (D1/D4) — the structural half of "LibreChat reaches the BFF
# ONLY": these three AuthorizationPolicies are what make it true even if
# a future edit to librechat.yaml or the LibreChat env tried to add
# another route — the mesh itself rejects it. Combined with
# authorizationpolicy-keycloak.yaml / authorizationpolicy-memory.yaml
# (which whitelist the BFF's own SA, never LibreChat's), this closes the
# loop: LibreChat's SA appears in exactly one allow-list below (the BFF's)
# and nowhere else in the chart.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ .Release.Name }}-allow-librechat-bff
  labels:
    {{- include "audittrace.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: librechat-bff
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/{{ .Release.Name }}-librechat"
      to:
        - operation:
            ports: ["{{ .Values.console.bff.port }}"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ .Release.Name }}-allow-librechat
  labels:
    {{- include "audittrace.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: librechat
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
      to:
        - operation:
            ports: ["{{ .Values.console.librechat.port }}"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ .Release.Name }}-allow-librechat-mongodb
  labels:
    {{- include "audittrace.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: librechat-mongodb
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/{{ .Release.Namespace }}/sa/{{ .Release.Name }}-librechat"
      to:
        - operation:
            ports: ["27017"]
{{- end }}
