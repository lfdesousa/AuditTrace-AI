{{- if and .Values.istio.enabled .Values.console.enabled }}
# M3-WU-3b (D1) — exposes LibreChat at the WU-1 realm-registered
# `/librechat` path on the existing gateway. `rewrite.uri: /` strips the
# prefix before forwarding so LibreChat itself (unaware of any prefix)
# sees ordinary root-relative requests — see deployment-librechat.yaml's
# header comment for the DOMAIN_SERVER/OPENID_CALLBACK_URL pairing this
# depends on, and the honest caveat about SPA asset-path behaviour that
# still needs live E2E confirmation.
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ .Release.Name }}-librechat
  labels:
    {{- include "audittrace.labels" . | nindent 4 }}
spec:
  hosts:
    - "*"
  gateways:
    - {{ .Values.istio.gateway.name }}
  http:
    - match:
        - uri:
            prefix: /librechat
      rewrite:
        uri: /
      timeout: 1800s
      route:
        - destination:
            host: {{ .Release.Name }}-librechat.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.console.librechat.port }}
{{- end }}
