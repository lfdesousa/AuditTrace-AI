{{- /* M3-WU-3b (D4) — when vault.enabled, the BFF's RFC 8693 token-exchange
       confidential-client secret lives at kv/audittrace/librechat/bff-secret
       and is sourced via Vault Agent (audittrace.vaultAnnotations.librechatBff);
       this Secret is not rendered. See secrets.console.bffExchangeClientSecret
       in values.yaml for the vault.enabled=false fallback — laptop-dev only,
       never a committed real value. */ -}}
{{- if and .Values.console.enabled (not .Values.vault.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-librechat-bff-secret
  labels:
    {{- include "audittrace.labels" . | nindent 4 }}
type: Opaque
stringData:
  exchange-client-secret: {{ .Values.secrets.console.bffExchangeClientSecret | quote }}
{{- end }}
