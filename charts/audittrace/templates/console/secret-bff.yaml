{{- /* M3-WU-3b (D4) / M3-WU-3c (D1) — when the BFF's RFC 8693 token-exchange
       confidential-client secret is Vault-sourced (audittrace.console.bff.
       useVault == "true": vault.enabled AND console.bff.secretSource=vault,
       WU-3b's unchanged production posture), it lives at
       kv/audittrace/librechat/bff-secret via Vault Agent
       (audittrace.vaultAnnotations.librechatBff) and this Secret is not
       rendered at all — this WU never touches that path. Otherwise —
       vault.enabled=false (dev fallback) OR console.bff.secretSource=values
       (the WU-3c test-deploy unblock, even with vault.enabled=true
       cluster-wide) — this Secret carries the exchange secret;
       laptop-dev/test only, never a committed real value.

       M3-WU-D2-5F — generate-if-absent + persist, via the SAME
       audittrace.console.persistedSecret helper secret-librechat.yaml (D3)
       already uses. Before this WU, a plain `helm upgrade` re-rendered
       stringData from .Values.secrets.console.bffExchangeClientSecret
       (default "") on every apply — since the CD agent never re-passes the
       live secret on a routine upgrade, this EMPTIED the exchange secret on
       the running Secret every time, forcing the CD agent to remember a
       `--set-string` re-pass (the exact friction this WU exists to remove).
       Precedence is now: (1) an explicit non-empty
       secrets.console.bffExchangeClientSecret wins (operator/external-
       secret-manager override); (2) the value already in the cluster
       (found via a `lookup`-guarded read — only sees anything against a
       REAL cluster; `helm template`/`helm lint` always see an empty lookup
       and fall through to (3)) is reused, so `helm upgrade` never empties
       it; (3) a freshly generated value on a genuinely first install.
       Renders as `data:` (base64) rather than `stringData:` because the
       shared helper always returns base64 (existing cluster values arrive
       pre-base64 from the API server) — functionally identical once
       applied; only the rendered YAML text form changes. */ -}}
{{- if and .Values.console.enabled (ne (include "audittrace.console.bff.useVault" .) "true") }}
{{- $secretName := printf "%s-librechat-bff-secret" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $existingData := dict }}
{{- if $existing }}
{{- $existingData = $existing.data | default dict }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "audittrace.labels" . | nindent 4 }}
type: Opaque
data:
  exchange-client-secret: {{ include "audittrace.console.persistedSecret" (dict "explicit" .Values.secrets.console.bffExchangeClientSecret "existing" $existingData "key" "exchange-client-secret" "kind" "alnum") }}
{{- end }}
