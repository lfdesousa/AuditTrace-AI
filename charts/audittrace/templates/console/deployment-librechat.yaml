{{- if .Values.console.enabled }}
# M3-WU-D2-4 — LibreChat itself. The sovereign fork image (D2 cutover from
# the D1 stock-image posture — see values.yaml console.librechat comment).
# Routes to the BFF only (D4 — see authorizationpolicy-console.yaml); the
# ONE route it holds to the front door is the OIDC relying-party flow
# (discovery/JWKS/token — D2, resolved via the coredns-custom overlay,
# templates/dns/configmap-coredns-frontdoor.yaml — M3-WU-D2-5E), never a
# second route to /v1 or Keycloak's admin surface.
#
# M3-WU-3d (D4) — served at ROOT on its own dedicated host
# (`console.librechat.host`, default `librechat.audittrace.local`), NOT
# the `/librechat` subpath the WU-3b/3c builds used. Confirmed live on
# k3s 2026-08-29: the subpath fought LibreChat's own base-href/API
# routing (blank page; `/api/config` resolved to HTML instead of JSON).
# DOMAIN_CLIENT/DOMAIN_SERVER below carry the dedicated host at its root
# (no prefix); the VirtualService (virtualservice-console.yaml) routes
# that host at `/` with NO rewrite, matching what LibreChat itself
# expects. The realm's registered redirect URI is DOMAIN_SERVER +
# OPENID_CALLBACK_URL, which is kept in lock-step with
# keycloak.librechat.redirectUris (D5, both realm files).
# M3-WU-D2-5H (2026-09-02) — single source of truth for the OIDC discovery
# URL: computed ONCE here and referenced by BOTH the main container's
# OPENID_ISSUER env (below) and the initContainer's readiness-gate poll
# target (spec invariant: the gate must poll the SAME URL the app fetches,
# never a duplicated literal).
{{- $oidcDiscoveryURL := printf "https://%s/realms/audittrace/.well-known/openid-configuration" .Values.console.librechat.frontDoorHost }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-librechat
  labels:
    {{- include "audittrace.labels" . | nindent 4 }}
    app.kubernetes.io/component: librechat
spec:
  replicas: {{ .Values.console.librechat.replicaCount }}
  selector:
    matchLabels:
      {{- include "audittrace.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: librechat
  template:
    metadata:
      labels:
        {{- include "audittrace.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: librechat
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: {{ .Release.Name }}-librechat
      # M3-WU-D2-5E (2026-09-02) — the static `hostAliases` pin to the
      # node's LAN IP that used to live here is GONE (the 2026-09-01 DHCP
      # hard-down incident — see values.yaml console.frontDoorNodeName
      # comment). `console.librechat.frontDoorHost` now resolves via the
      # chart-templated coredns-custom overlay
      # (templates/dns/configmap-coredns-frontdoor.yaml), never a pod
      # `/etc/hosts` entry.
      # M3-WU-D2-5H (2026-09-02) — the OIDC discovery startup-ordering gate.
      # LibreChat configures its `openid` passport strategy via a ONE-SHOT,
      # NO-RETRY fetch of OPENID_ISSUER at process start: if Keycloak (or
      # the Istio gateway in front of it) is not yet serving the front door
      # on a boot storm, the strategy is never registered for the life of
      # the process and every login fails with `Unknown authentication
      # strategy "openid"` — even though the pod itself looks healthy (2/2,
      # /health green). Confirmed live on the 2026-09-01 PM reboot: Part
      # E's DNS fix (frontDoorNodeName, above) was intact and the host IP
      # had NOT even changed, yet the race still fired because this pod won
      # the race against Keycloak's readiness. This gate complements —
      # does NOT replace — Part E: E makes the discovery URL resolvable,
      # this initContainer makes WHEN it's fetched safe by blocking the
      # main container until a real HTTP 200 is observed. Reuses the SAME
      # fork image as the init image (no new egress image, no new
      # CA-trust surface — it already carries Node + the identical
      # NODE_EXTRA_CA_CERTS/insecureTLS wiring the main container's real
      # discovery fetch trusts, so this probe validates the SAME TLS
      # chain). Bounded via console.librechat.oidcWait: on timeout it
      # exits non-zero so the pod surfaces a loud `Init:CrashLoopBackOff`
      # rather than silently starting into an unregistered-strategy state.
      initContainers:
        - name: wait-for-oidc-discovery
          image: "{{ .Values.console.librechat.image.repository }}:{{ .Values.console.librechat.image.tag }}{{ if .Values.console.librechat.image.digest }}@{{ .Values.console.librechat.image.digest }}{{ end }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: OIDC_DISCOVERY_URL
              value: {{ $oidcDiscoveryURL | quote }}
            - name: OIDC_WAIT_TIMEOUT_SECONDS
              value: {{ .Values.console.librechat.oidcWait.timeoutSeconds | quote }}
            - name: OIDC_WAIT_INTERVAL_SECONDS
              value: {{ .Values.console.librechat.oidcWait.intervalSeconds | quote }}
            {{- if .Values.console.librechat.insecureTLS }}
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"
            {{- else }}
            - name: NODE_EXTRA_CA_CERTS
              value: "/etc/audittrace/ca.crt"
            {{- end }}
          {{- if not .Values.console.librechat.insecureTLS }}
          volumeMounts:
            - name: ca-trust
              mountPath: /etc/audittrace/ca.crt
              subPath: ca.crt
              readOnly: true
          {{- end }}
          command:
            - sh
            - -c
            - |
              cat <<'JS' > /tmp/oidc-discovery-check.js
              const https = require('https');
              const url = process.env.OIDC_DISCOVERY_URL;
              const req = https.get(url, { timeout: 5000 }, (res) => {
                console.log(res.statusCode);
                res.resume();
              });
              req.on('timeout', () => { req.destroy(); });
              req.on('error', () => { console.log('0'); });
              JS
              elapsed=0
              echo "wait-for-oidc-discovery: polling ${OIDC_DISCOVERY_URL} (timeout=${OIDC_WAIT_TIMEOUT_SECONDS}s interval=${OIDC_WAIT_INTERVAL_SECONDS}s)"
              while true; do
                status=$(node /tmp/oidc-discovery-check.js 2>/dev/null)
                status="${status:-0}"
                if [ "$status" = "200" ]; then
                  echo "wait-for-oidc-discovery: HTTP 200 after ${elapsed}s - discovery ready, starting main container"
                  exit 0
                fi
                if [ "$elapsed" -ge "$OIDC_WAIT_TIMEOUT_SECONDS" ]; then
                  echo "wait-for-oidc-discovery: still not ready after ${OIDC_WAIT_TIMEOUT_SECONDS}s (last status=${status}) - failing loudly (Init:CrashLoopBackOff) rather than starting LibreChat into an unregistered-strategy state"
                  exit 1
                fi
                sleep "$OIDC_WAIT_INTERVAL_SECONDS"
                elapsed=$((elapsed + OIDC_WAIT_INTERVAL_SECONDS))
              done
      containers:
        - name: librechat
          image: "{{ .Values.console.librechat.image.repository }}:{{ .Values.console.librechat.image.tag }}{{ if .Values.console.librechat.image.digest }}@{{ .Values.console.librechat.image.digest }}{{ end }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.console.librechat.port }}
              protocol: TCP
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: {{ .Values.console.librechat.port | quote }}
            - name: MONGO_URI
              value: "mongodb://{{ .Release.Name }}-librechat-mongodb:27017/LibreChat"
            - name: DOMAIN_CLIENT
              value: "https://{{ .Values.console.librechat.host }}"
            - name: DOMAIN_SERVER
              value: "https://{{ .Values.console.librechat.host }}"
            # B4 — only the AuditTrace custom endpoint is exposed.
            - name: ENDPOINTS
              value: "custom"
            # ── auth / registration (D2) ────────────────────────────────
            - name: ALLOW_REGISTRATION
              value: "false"
            - name: ALLOW_EMAIL_LOGIN
              value: "false"
            - name: ALLOW_PASSWORD_RESET
              value: "false"
            - name: ALLOW_SHARED_LINKS
              value: "false"
            - name: ALLOW_SOCIAL_LOGIN
              value: "true"
            # ── OIDC (audittrace-librechat, public client, PKCE) ────────
            # M3-WU-3d (D3) — LibreChat refuses to complete OIDC discovery
            # over plain HTTP (confirmed live on k3s 2026-08-29: an
            # in-cluster `http://...:8080` issuer silently failed OIDC
            # setup). The `.well-known` form below sidesteps the iss-
            # string mismatch (Keycloak's canonical `iss` differs from the
            # external front door) the same way the WU-3 compose profile's
            # issuer did. Reached via the front-door HOST NAME (not the
            # in-cluster Service) — the coredns-custom overlay (M3-WU-D2-5E,
            # templates/dns/configmap-coredns-frontdoor.yaml) is what makes
            # that name resolve from inside the cluster; the CA-trust /
            # insecureTLS wiring below is what makes the resulting HTTPS
            # call actually validate.
            - name: OPENID_ISSUER
              value: {{ $oidcDiscoveryURL | quote }}
            - name: OPENID_CLIENT_ID
              value: "audittrace-librechat"
            # `audittrace-librechat` is a PUBLIC client (PKCE, no secret —
            # WU-1, frozen). Stock LibreChat will not attempt OIDC setup
            # at all with an empty OPENID_CLIENT_SECRET (verified live
            # against the pinned image during WU-3); this placeholder is
            # never a real credential and is not verified server-side —
            # Keycloak skips client authentication entirely for
            # publicClient clients (PKCE is what actually authorizes the
            # exchange).
            - name: OPENID_CLIENT_SECRET
              value: "unused-public-client-pkce-see-values-comment"
            - name: OPENID_USE_PKCE
              value: "true"
            - name: OPENID_SCOPE
              value: {{ .Values.console.librechat.openidScope | quote }}
            - name: OPENID_CALLBACK_URL
              value: "/oauth/openid/callback"
            - name: OPENID_BUTTON_LABEL
              value: "AuditTrace SSO"
            # D2 — the paste-killer. Makes LibreChat's own session reuse
            # the user's server-side OIDC access token (rather than
            # minting a separate LibreChat JWT) — the custom-endpoint
            # header placeholder in librechat.yaml
            # (configmap-librechat-yaml.yaml, packages/api/src/utils/
            # oidc.ts) resolves from exactly this token.
            - name: OPENID_REUSE_TOKENS
              value: "true"
            - name: OPENID_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-librechat-secret
                  key: openid-session-secret
            - name: CREDS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-librechat-secret
                  key: creds-key
            - name: CREDS_IV
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-librechat-secret
                  key: creds-iv
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-librechat-secret
                  key: jwt-secret
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-librechat-secret
                  key: jwt-refresh-secret
            # M3-WU-3d (D3) — Node's TLS trust for the OIDC discovery/
            # token/JWKS calls LibreChat's backend makes directly to the
            # (self-signed, laptop target) front door. Default/preferred
            # path: mount the cluster CA as a trust anchor (see
            # configmap-ca-trust.yaml) and point NODE_EXTRA_CA_CERTS at
            # it — Node then validates the front door's certificate
            # normally. `console.librechat.insecureTLS=true` is a
            # laptop-only quick path that disables Node's certificate
            # validation outright instead — never use it against
            # anything but a throwaway/dev cluster.
            {{- if .Values.console.librechat.insecureTLS }}
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"
            {{- else }}
            - name: NODE_EXTRA_CA_CERTS
              value: "/etc/audittrace/ca.crt"
            {{- end }}
            # M3-WU-D2-4 — the fork's sovereign one-brain switch (D2
            # cutover). AUDITTRACE_MEMORY_BACKEND renders
            # console.librechat.memoryBackend VERBATIM — the fork's
            # config.js fails CLOSED to Mongo for any value that is not
            # exactly "sovereign" (never silently forced here). The BFF
            # base URL names the real in-cluster Service
            # (templates/console/service-bff.yaml), never hardcoded.
            - name: AUDITTRACE_MEMORY_BACKEND
              value: {{ .Values.console.librechat.memoryBackend | quote }}
            - name: AUDITTRACE_BFF_BASE_URL
              value: "http://{{ .Release.Name }}-librechat-bff:{{ .Values.console.bff.port }}"
            - name: AUDITTRACE_BFF_TIMEOUT_MS
              value: {{ .Values.console.librechat.bffTimeoutMs | quote }}
          volumeMounts:
            - name: librechat-yaml
              mountPath: /app/librechat.yaml
              subPath: librechat.yaml
              readOnly: true
            {{- if not .Values.console.librechat.insecureTLS }}
            - name: ca-trust
              mountPath: /etc/audittrace/ca.crt
              subPath: ca.crt
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.console.librechat.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: librechat-yaml
          configMap:
            name: {{ .Release.Name }}-librechat-yaml
        {{- if not .Values.console.librechat.insecureTLS }}
        - name: ca-trust
          configMap:
            name: {{ .Release.Name }}-librechat-ca-trust
        {{- end }}
{{- end }}
